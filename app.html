<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#1D2D4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SGA">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/app_icon.png">
<title>산본글로벌어학원 · SGA App</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
 --navy:#1D2D4F; --navy2:#2B4173; --gold:#C6A15B; --gold2:#E7C989;
 --red:#C81F2B; --green:#0E8A5A; --blue:#2F6FB0; --purple:#7658C8;
 --ink:#141A26; --ink2:#4A5468; --ink3:#8A94A8;
 --line:#E4E7EE; --line2:#F0F2F6; --bg:#F6F7FA; --card:#FFFFFF;
 --nav-h:64px; --sh:0 1px 2px rgba(20,26,38,.05),0 10px 26px -16px rgba(20,26,38,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- shell ---------- */
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px)}
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line2);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;min-height:54px}
.top .logo{height:26px;width:auto}
.top h1{font-size:16px;font-weight:900;margin:0;letter-spacing:-.02em;flex:1}
.top .act{background:none;border:0;font-size:20px;cursor:pointer;color:var(--ink2);padding:4px}
.pg{padding:16px 16px 8px;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.pg{animation:none}}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:520px;margin:0 auto;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink3);font-size:10.5px;font-weight:700}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--navy)}
.nav button.on svg{stroke:var(--navy)}

/* ---------- blocks ---------- */
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.card.pad0{padding:0;overflow:hidden}
.sec-t{font-size:13px;font-weight:900;color:var(--ink2);margin:18px 2px 9px;display:flex;align-items:center;justify-content:space-between}
.sec-t a{font-size:12px;color:var(--ink3);font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border:0;border-radius:13px;padding:15px;font-size:15px;font-weight:900;cursor:pointer;background:var(--navy);color:#fff}
.btn:active{transform:scale(.985)}
.btn.g{background:var(--green)}
.btn.r{background:var(--red)}
.btn.o{background:#fff;color:var(--ink2);border:1.5px solid var(--line)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3A2B08}
.btn+.btn{margin-top:8px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.muted{color:var(--ink3);font-size:12.5px}

/* hero */

/* ===== 첫 화면(가입 전) — 2026-08-30 새로 만듦 =====
   AI 학습앱이 학원의 주 수익원이 되어야 하는데 설명이 한 줄도 없었습니다.
   무엇을 하는 앱인지, 왜 시중 앱이 아니라 이것인지, 얼마인지까지 담았습니다. */
.wc-hero{background:linear-gradient(150deg,#141F38,#22345C 55%,#2B4173);color:#fff;border-radius:20px;
 padding:26px 20px 22px;margin-bottom:16px;position:relative;overflow:hidden;text-align:center}
.wc-hero:before{content:"";position:absolute;left:50%;top:-120px;width:320px;height:320px;transform:translateX(-50%);
 border-radius:50%;background:radial-gradient(circle,rgba(198,161,91,.30),transparent 66%)}
.wc-em{position:relative;width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));margin-bottom:8px}
.wc-eye{position:relative;font-size:10.5px;font-weight:900;letter-spacing:.22em;color:var(--gold2)}
.wc-hero h2{position:relative;font-size:22px;font-weight:900;line-height:1.42;margin:8px 0 10px;letter-spacing:-.02em;word-break:keep-all}
.wc-hero h2 b{color:var(--gold2)}
.wc-hero p{position:relative;font-size:14px;line-height:1.75;color:#C7D2E6;margin:0}
.wc-hero p b{color:#fff}
.wc-badges{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.wc-badges span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;
 padding:6px 11px;font-size:11.5px;font-weight:800}
.wc-h{margin:22px 2px 10px}
.wc-h b{display:block;font-size:18px;font-weight:900;letter-spacing:-.02em}
.wc-h em{display:block;font-style:normal;font-size:12.5px;color:var(--ink3);margin-top:2px}
/* 산글이 말풍선 */
.sgtalk{padding:14px}
.sgt-hd{display:flex;align-items:center;gap:10px;padding-bottom:11px;border-bottom:1px solid var(--line2);margin-bottom:11px}
.sgt-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(140deg,#1D2D4F,#2B4173);
 display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.sgt-hd b{display:block;font-size:14px;font-weight:900;line-height:1.3}
.sgt-hd i{font-style:normal;font-size:11.5px;color:var(--ink3)}
.sgt-body{display:flex;flex-direction:column;gap:8px;min-height:96px}
.sgt-b{background:var(--line2);border-radius:4px 14px 14px 14px;padding:11px 13px;font-size:14px;line-height:1.7;
 color:var(--ink2);animation:sgtIn .32s ease}
.sgt-b b{color:var(--navy);font-weight:900}
@keyframes sgtIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.sgt-b{animation:none}}
.sgt-again{margin-top:11px;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:11px;
 padding:10px;font-size:13px;font-weight:800;color:var(--ink2);cursor:pointer}
/* 화면 미리보기 */
.wc-shots{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.wc-shots::-webkit-scrollbar{display:none}
.wc-shot{flex:0 0 168px;scroll-snap-align:center;text-align:center}
.wc-shot>span{display:block;font-size:12.5px;font-weight:900;color:var(--ink2);margin-top:8px}
.ph{background:#141A26;border-radius:20px;padding:9px 7px;box-shadow:var(--sh);position:relative}
.ph-nt{width:44px;height:4px;border-radius:99px;background:#3A4557;margin:1px auto 7px}
.ph-in{background:#fff;border-radius:13px;padding:9px;min-height:212px;display:flex;flex-direction:column;gap:6px}
.mk-bar{background:var(--line2);border-radius:8px;padding:6px 8px;font-size:10px;font-weight:900;color:var(--ink2);text-align:left}
.mk-b{font-size:10.5px;line-height:1.5;border-radius:10px;padding:7px 9px;max-width:88%;text-align:left}
.mk-b.them{background:var(--line2);color:var(--ink2);border-top-left-radius:3px;align-self:flex-start}
.mk-b.me{background:var(--navy);color:#fff;border-top-right-radius:3px;align-self:flex-end}
.mk-mic{margin-top:auto;background:var(--red);color:#fff;border-radius:999px;padding:8px;font-size:10.5px;font-weight:900;text-align:center}
.mk-sent{font-size:12px;font-weight:800;color:var(--ink);line-height:1.5;text-align:left}
.mk-sent u{color:var(--red);text-decoration-thickness:2px}
.mk-score{display:flex;align-items:baseline;justify-content:center;gap:2px;margin:2px 0}
.mk-score b{font-size:38px;font-weight:900;color:var(--green);line-height:1}
.mk-score span{font-size:12px;font-weight:900;color:var(--green)}
.mk-tip{background:#EAF7F0;border-radius:9px;padding:8px;font-size:10px;line-height:1.6;color:#0B5C3D;text-align:left}
.mk-tip b{font-weight:900}
.mk-graph{display:flex;align-items:flex-end;gap:4px;height:66px;padding:0 2px}
.mk-graph i{flex:1;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:3px 3px 0 0}
.mk-rows{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--ink3);
 border-top:1px solid var(--line2);padding-top:5px}
.mk-rows b{font-size:12px;font-weight:900;color:var(--ink)}
.wc-swipe{text-align:center;font-size:11.5px;color:var(--ink3);margin:0 0 4px}
/* 기능 */
.wc-fx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wc-f{background:var(--card);border-radius:14px;padding:13px;box-shadow:var(--sh)}
.wc-f .fi{font-size:21px;line-height:1;display:block;margin-bottom:6px}
.wc-f b{display:block;font-size:13.5px;font-weight:900;letter-spacing:-.02em}
.wc-f p{margin:4px 0 0;font-size:11.5px;line-height:1.65;color:var(--ink3);word-break:keep-all}
/* 왜 학원 앱인가 */
.wc-why{margin-top:16px}
.wy-t{display:block;font-size:15.5px;font-weight:900;margin-bottom:10px}
.wy-r{border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:7px}
.wy-r span{display:block;font-size:12px;font-weight:900;color:var(--ink3)}
.wy-r em{display:block;font-style:normal;font-size:13px;line-height:1.65;color:var(--ink2);margin-top:3px}
.wy-r.on{border-color:var(--green);background:#F2FAF6}
.wy-r.on span{color:var(--green)}
.wy-r.on em b{color:#0B5C3D;font-weight:900}
.wy-n{margin:10px 0 0;font-size:12.5px;color:var(--ink3);line-height:1.7}
.wy-n b{color:var(--ink);font-weight:900}
/* 값 */
.wc-price{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.wp{background:var(--card);border-radius:16px;padding:15px 13px;box-shadow:var(--sh);border:1.5px solid var(--line);display:flex;flex-direction:column}
.wp.free{border-color:var(--green);background:linear-gradient(180deg,#F2FAF6,#fff)}
.wp-t{font-size:11.5px;font-weight:900;color:var(--ink3)}
.wp.free .wp-t{color:var(--green)}
.wp-p{font-size:30px;font-weight:900;letter-spacing:-.03em;margin:4px 0 9px;line-height:1.1}
.wp-p span{font-size:13px;font-weight:800;color:var(--ink3)}
.wp.free .wp-p{color:var(--green)}
.wp ul{margin:0;padding-left:15px;font-size:11.5px;line-height:1.75;color:var(--ink2)}
.wp ul b{font-weight:900;color:var(--ink)}
.wp-n{margin-top:auto;padding-top:9px;font-size:10.5px;color:var(--ink3);line-height:1.5}
.wp-b{margin-top:auto;border:0;background:var(--navy);color:#fff;border-radius:10px;padding:10px;font-size:12.5px;font-weight:900;cursor:pointer}
.wc-go{margin-top:2px}
.hero{background:linear-gradient(140deg,var(--navy),var(--navy2));color:#fff;border-radius:18px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(198,161,91,.18)}
.hero .hi{font-size:13px;color:#B9C6DE;position:relative}
.hero .nm{font-size:20px;font-weight:900;margin:2px 0 12px;position:relative}
.hero .nm b{color:var(--gold2)}
.streak{display:flex;gap:8px;position:relative}
.streak div{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:9px 6px;text-align:center}
.streak b{display:block;font-size:19px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.streak span{font-size:10.5px;color:#B9C6DE;font-weight:700}

/* goal ring */
.goal{display:flex;align-items:center;gap:14px}
.ring{width:74px;height:74px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.goal .gt{flex:1}
.goal .gt b{display:block;font-size:15px;font-weight:900}
.goal .gt span{font-size:12.5px;color:var(--ink3)}

/* lang tabs */
/* 포인트샵 */
.gwrap{display:grid;gap:10px}
.gf{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px 15px;box-shadow:var(--sh);opacity:.62}
.gf.ok{opacity:1}
.gf .gi{width:46px;height:46px;flex:none;border-radius:13px;background:var(--line2);display:flex;align-items:center;justify-content:center;font-size:23px}
.gf .gt{flex:1;min-width:0}
.gf .gt b{display:block;font-size:14.5px;font-weight:800}
.gf .gt span{font-size:12.5px;color:var(--ink3)}
.gb{flex:none;border:none;border-radius:999px;background:var(--green);color:#fff;font-size:13px;font-weight:900;padding:10px 15px;cursor:pointer;font-family:inherit;white-space:nowrap}
.gb.off{background:var(--line);color:var(--ink3)}
.pr{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.pr:last-child{border-bottom:none}
.pr span{flex:1;min-width:0;color:var(--ink2)}
.pr b{font-weight:900;color:var(--navy);white-space:nowrap}
.pr em{font-style:normal;font-size:11.5px;color:var(--ink3);width:52px;text-align:right;flex:none}
.pr.bo span{color:var(--navy);font-weight:700}
/* 100일 통암기 */
.mm{text-align:center}
.mm-h{font-size:12px;font-weight:900;color:var(--ink3);letter-spacing:.06em;margin-bottom:12px}
.mm-s{display:inline-block;background:var(--navy);color:#fff;font-size:11.5px;font-weight:900;padding:4px 12px;border-radius:999px;margin-bottom:16px}
.mm-f{font-size:22px;font-weight:800;color:var(--ink);line-height:1.45;margin:6px 0 8px;word-break:keep-all;transition:filter .2s}
.mm-f.blur{filter:blur(9px);cursor:pointer}
.mm-k{font-size:15px;color:var(--ink2);margin-bottom:14px;word-break:keep-all}
.mm-k.big{font-size:20px;font-weight:800;color:var(--ink);margin:10px 0 16px}
.mm-r{background:var(--line2);border-radius:12px;padding:14px;font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:14px;min-height:52px;display:flex;flex-direction:column;justify-content:center;word-break:break-word}
.mm-said{font-size:12.5px;font-weight:500;color:var(--ink3);margin-top:6px}
.langs{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.langs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:13px;font-weight:800;color:var(--ink2);cursor:pointer}
.langs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* menu grid */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.mgrid button{background:var(--card);border:0;border-radius:14px;padding:13px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--ink2);cursor:pointer;box-shadow:var(--sh)}
.mgrid .ic{font-size:21px;line-height:1}

/* list */
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li .ic{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--line2)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:14px;font-weight:800}
.li .tx span{font-size:12px;color:var(--ink3)}
.li .go{color:var(--ink3);font-size:15px}
.badge{font-size:10.5px;font-weight:900;border-radius:999px;padding:2.5px 8px;white-space:nowrap}
.b-g{background:#E4F6ED;color:var(--green)}
.b-r{background:#FDE8E9;color:var(--red)}
.b-o{background:#FFF4DE;color:#9A7B2E}
.b-b{background:#E8F0FA;color:var(--blue)}

/* study card */
.sc{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--sh);margin-bottom:12px}
.sc .lv{font-size:11px;font-weight:900;color:var(--gold);letter-spacing:.1em;text-transform:uppercase}
.sc .fr{font-size:20px;font-weight:900;line-height:1.45;margin:7px 0 5px;word-break:keep-all}
.sc .ko{font-size:14px;color:var(--ink2)}
.sc .rom{font-size:12.5px;color:var(--ink3);margin-top:3px}
.sc .acts{display:flex;gap:8px;margin-top:14px}
.sc .acts button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:11px;font-size:13px;font-weight:800;cursor:pointer;color:var(--ink2)}
.sc .acts button.pri{background:var(--green);color:#fff;border-color:var(--green)}

/* mic */
.mic{width:78px;height:78px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:30px;display:grid;place-items:center;margin:0 auto;cursor:pointer;box-shadow:0 8px 24px rgba(200,31,43,.35)}
.mic.rec{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,31,43,.5)}50%{box-shadow:0 0 0 16px rgba(200,31,43,0)}}
@media(prefers-reduced-motion:reduce){.mic.rec{animation:none}}
.heard{background:var(--line2);border-radius:12px;padding:13px;font-size:14px;min-height:48px;margin-top:14px;line-height:1.6}
.heard .ok{color:var(--green);font-weight:800}
.heard .no{color:var(--red);font-weight:800;text-decoration:line-through}

/* chat */
.chat{display:flex;flex-direction:column;gap:9px;padding:4px 0 8px;min-height:42vh}
.msg{display:flex}
.msg.me{justify-content:flex-end}
.bub{max-width:84%;padding:11px 14px;border-radius:15px;font-size:14px;line-height:1.6;background:#fff;box-shadow:var(--sh)}
.msg.me .bub{background:var(--green);color:#fff}
.bub .tr{display:block;font-size:11.5px;color:var(--ink3);margin-top:4px}

/* score */
.score{text-align:center;padding:6px 0 2px}
.score .n{font-size:44px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.score .l{font-size:13px;color:var(--ink3);font-weight:700;margin-top:4px}
.bars{display:grid;gap:9px;margin-top:14px}
.bar b{font-size:12.5px;font-weight:800;display:flex;justify-content:space-between}
.bar .t{height:8px;border-radius:99px;background:var(--line2);margin-top:5px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:99px;background:var(--green)}

/* calendar strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.week div{padding:7px 0;border-radius:11px;background:var(--line2);font-size:11px;font-weight:800;color:var(--ink3)}
.week div b{display:block;font-size:14px;color:var(--ink2);margin-top:2px}
.week div.done{background:var(--green);color:#fff}
.week div.done b{color:#fff}
.week div.today{outline:2px solid var(--navy)}

/* plan */
.plan{border:1.5px solid var(--line);border-radius:15px;padding:15px;margin-bottom:10px;background:var(--card)}
.plan.on{border-color:var(--gold);background:linear-gradient(180deg,#FFFBF2,#fff)}
.plan .pt{font-size:11px;font-weight:900;color:var(--gold);letter-spacing:.08em}
.plan h4{margin:4px 0 2px;font-size:16px;font-weight:900}
.plan .pr{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.plan .pr s{font-size:14px;color:var(--ink3);font-weight:700;margin-right:6px}
.plan ul{margin:9px 0 0;padding-left:17px;font-size:12.5px;color:var(--ink2)}

/* modal */
.sheet{position:fixed;inset:0;z-index:200;background:rgba(15,20,32,.5);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .in{position:relative;background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;animation:up .25s ease}
/* 2026-08-30 — 시트를 열면 빠져나올 길이 없었습니다. 항상 보이는 뒤로 버튼을 답니다. */
.sheet .in:before{content:"";position:sticky;top:0;display:block;height:0}
.sheet-x{position:sticky;top:-4px;float:right;z-index:5;margin:-6px -4px 0 0;border:1.5px solid var(--line);
 background:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:900;color:var(--ink2);
 cursor:pointer;font-family:inherit;line-height:1;box-shadow:0 3px 10px rgba(15,20,32,.10)}
.sheet-x:hover,.sheet-x:active{border-color:var(--navy);color:var(--navy)}
.sheet h3{clear:none}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.sheet h3{margin:0 0 4px;font-size:18px;font-weight:900}
.sheet .sub{font-size:13px;color:var(--ink3);margin-bottom:14px}
.fld{display:block;margin-bottom:11px}
.fld span{display:block;font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:5px}
.fld input,.fld select{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:13px;font-size:15px;background:#fff;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800;color:var(--ink2);cursor:pointer}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 22px);transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:999px;z-index:300;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.empty{text-align:center;padding:38px 20px;color:var(--ink3);font-size:13.5px}
.empty .e{font-size:36px;display:block;margin-bottom:8px}

/* ===== 가입 전 첫 화면 v3 — "진짜 AI가 온 것처럼" (2026-09-02 대표님 지시) =====
   어두운 바탕 + 브랜드 적색 그리드. 로고는 app_emblem.png(흰 테두리 제거판)만 씁니다. */
body.wdark{background:#0A0E19}
body.wdark #app{max-width:none;background:#0A0E19}
body.wdark .top{background:rgba(10,14,25,.92);border-bottom-color:#1A2233}
body.wdark .top h1{color:#fff}
body.wdark .top .act{color:#8A94A8}
body.wdark .pg{padding:0 0 8px;max-width:none}
.aiw{color:#E8ECF5}
.aiw .in{max-width:820px;margin:0 auto;padding:0 16px}
/* 영상 히어로 — 화면 꽉 차게 */
.aiw-vh{position:relative;background:#070A12;overflow:hidden}
.aiw-vwrap{position:relative;max-width:820px;margin:0 auto}
.aiw-v{display:block;width:100%;aspect-ratio:1/1;max-height:76vh;object-fit:cover;background:radial-gradient(circle at 50% 38%,#22345C,#070A12 75%)}
@media(min-width:720px){.aiw-v{aspect-ratio:16/10}}
.aiw-vh:after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,transparent,rgba(7,10,18,.94));pointer-events:none}
.aiw-cap{position:absolute;left:0;right:0;bottom:0;z-index:3;text-align:center;padding:0 18px 20px}
.aiw-eye{font-size:11px;font-weight:900;letter-spacing:.24em;color:#FF8D96}
.aiw-cap h2{margin:6px 0 6px;font-size:clamp(24px,6vw,34px);font-weight:900;letter-spacing:-.02em;line-height:1.3;color:#fff;word-break:keep-all;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.aiw-cap h2 b{color:#FFD94D}
.aiw-cap p{margin:0;font-size:13.5px;line-height:1.7;color:#C7D2E6;word-break:keep-all;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.aiw-snd{position:absolute;right:14px;top:14px;z-index:4;display:flex;align-items:center;gap:7px;border:1.5px solid rgba(255,255,255,.45);background:rgba(7,10,18,.55);backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:9px 14px;font-size:12.5px;font-weight:900;cursor:pointer}
.aiw-snd.on{background:var(--red);border-color:var(--red)}
.aiw-em{position:absolute;left:14px;top:12px;z-index:4;display:flex;align-items:center;gap:8px}
.aiw-em img{width:40px;height:40px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.aiw-em b{font-size:12.5px;font-weight:900;color:#fff;letter-spacing:.02em;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.aiw-em i{display:block;font-style:normal;font-size:10px;color:#C7D2E6;font-weight:700;letter-spacing:.12em}
/* 섹션 제목 */
.aiw-h{margin:26px 2px 12px;text-align:center}
.aiw-h b{display:block;font-size:19px;font-weight:900;letter-spacing:-.02em;color:#fff}
.aiw-h b u{text-decoration:none;color:#FF6B75}
.aiw-h em{display:block;font-style:normal;font-size:12.5px;color:#8A94A8;margin-top:3px}
/* 적색 그리드 — 강의관풍 타일 */
.aiw-fx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:720px){.aiw-fx{grid-template-columns:repeat(3,1fr)}}
.aiw-f{position:relative;background:linear-gradient(165deg,#171E30,#101523);border:1.5px solid rgba(200,31,43,.55);border-radius:14px;padding:14px 13px;overflow:hidden}
.aiw-f:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),#FF6B75)}
.aiw-f .fi{font-size:22px;line-height:1;display:block;margin-bottom:7px}
.aiw-f b{display:block;font-size:14px;font-weight:900;letter-spacing:-.02em;color:#fff}
.aiw-f p{margin:4px 0 0;font-size:12px;line-height:1.65;color:#A9B4C8;word-break:keep-all}
/* 무료 체험관 */
.aiw-try{background:linear-gradient(150deg,#3A0E13,#C81F2B 130%);border:1.5px solid rgba(255,120,130,.5);border-radius:18px;padding:20px 16px;text-align:center;margin-top:6px}
.aiw-try .tt{font-size:11px;font-weight:900;letter-spacing:.22em;color:#FFB3B9}
.aiw-try h3{margin:7px 0 8px;font-size:22px;font-weight:900;color:#fff;letter-spacing:-.02em;word-break:keep-all}
.aiw-try h3 b{color:#FFD94D}
.aiw-try p{margin:0 0 4px;font-size:13px;line-height:1.75;color:#FFE0E3;word-break:keep-all}
.aiw-try .rr{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:12px 0 14px}
.aiw-try .rr span{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:800;color:#fff}
.aiw-try .bb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aiw-try .bb a{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:13px 8px;font-size:13.5px;font-weight:900;text-decoration:none}
.aiw-try .bb a.w{background:#fff;color:var(--red)}
.aiw-try .bb a.o{border:1.5px solid rgba(255,255,255,.55);color:#fff}
/* 가입 = 무료 */
.aiw-free{background:linear-gradient(160deg,#171E30,#101523);border:1.5px solid rgba(198,161,91,.55);border-radius:18px;padding:20px 16px;text-align:center}
.aiw-free .zt{font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--gold2)}
.aiw-free .zp{font-size:44px;font-weight:900;color:#fff;line-height:1.1;margin:6px 0 2px}
.aiw-free .zp span{font-size:17px;color:var(--gold2)}
.aiw-free p{margin:4px 0 0;font-size:13px;line-height:1.75;color:#A9B4C8;word-break:keep-all}
.aiw-free p b{color:#fff}
/* 다크판 위 기존 요소 손질 */
body.wdark .sgtalk{background:#121828;border:1px solid #232D42}
body.wdark .sgt-hd{border-bottom-color:#232D42}
body.wdark .sgt-hd b{color:#fff}
body.wdark .sgt-b{background:#1B2436;color:#C7D2E6}
body.wdark .sgt-b b{color:#FFD94D}

.aiw-go{max-width:520px;margin:0 auto}

body.wdark .nav button{color:#6E7A90}
body.wdark .nav button.on{color:#fff}
body.wdark .nav button.on svg{stroke:#fff}

<body>

<div id="app">
  <div class="top">
    <img class="logo" src="img/app_emblem.png" alt="SGA" onerror="this.style.display='none'">
    <h1 id="ttl">홈</h1>
    <button class="act" onclick="openSheet('set')" aria-label="설정">⚙️</button>
  </div>
  <div class="pg" id="pg"></div>
</div>

<nav class="nav"><div class="in">
  <button data-t="home" class="on" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>홈</button>
  <button data-t="learn" onclick="go('learn')"><svg viewBox="0 0 24 24"><path d="M4 5h7a2 2 0 0 1 2 2v13a1.5 1.5 0 0 0-1.5-1.5H4z"/><path d="M20 5h-7a2 2 0 0 0-2 2v13a1.5 1.5 0 0 1 1.5-1.5H20z"/></svg>학습</button>
  <button data-t="talk" onclick="go('talk')"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>AI회화</button>
  <button data-t="rep" onclick="go('rep')"><svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>리포트</button>
  <button data-t="me" onclick="go('me')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>내정보</button>
</div></nav>

<div class="sheet" id="sheet"><div class="in"><button class="sheet-x" type="button" onclick="closeSheet()" aria-label="닫기">‹ 뒤로</button><div id="sheetIn"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 저장소 ================= */
var DB={
 get:function(){try{return JSON.parse(localStorage.getItem('sga_app')||'{}');}catch(e){return {};}},
 set:function(o){try{localStorage.setItem('sga_app',JSON.stringify(o));}catch(e){}},
 init:function(){var d=this.get();
  if(!d.v){d={v:1,user:null,lang:'영어',goal:10,streak:0,last:'',days:{},mins:0,words:[],logs:[],lvl:{},plan:'none',offline:false};this.set(d);}
  if(!d.words)d.words=[];if(!d.logs)d.logs=[];if(!d.days)d.days={};if(!d.lvl)d.lvl={};
  if(typeof d.pt!=='number')d.pt=0;if(!d.ptlog)d.ptlog=[];if(!d.ptday)d.ptday={};if(!d.gifts)d.gifts=[];
  return d;},
 save:function(f){var d=this.get();f(d);this.set(d);return d;}
};
function today(){var t=new Date();return t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2);}
function addMin(m,kind){DB.save(function(d){
  var t=today();d.days[t]=(d.days[t]||0)+m;d.mins=(d.mins||0)+m;
  if(d.last!==t){var y=new Date();y.setDate(y.getDate()-1);
    var ys=y.getFullYear()+'-'+('0'+(y.getMonth()+1)).slice(-2)+'-'+('0'+y.getDate()).slice(-2);
    d.streak=(d.last===ys)?(d.streak||0)+1:1;d.last=t;}
  d.logs.unshift({t:t,k:kind,m:m});if(d.logs.length>120)d.logs.length=120;
});}
/* ================= 산글 포인트 (학습 리워드) ================= */
var PTRULE=[
 {k:'attend', p:10,  cap:1,  n:'학원 출석체크'},
 {k:'memo',   p:5,   cap:6,  n:'통암기 한 문장 완성'},
 {k:'talk',   p:20,  cap:3,  n:'AI 회화 한 판 완료'},
 {k:'pron',   p:5,   cap:6,  n:'발음 80점 이상'},
 {k:'daily',  p:5,   cap:3,  n:'오늘의 표현 따라 말하기'},
 {k:'goal',   p:15,  cap:1,  n:'하루 목표 시간 달성'}
];
var PTBONUS=[{d:7,p:100,n:'7일 연속 학습'},{d:14,p:250,n:'14일 연속 학습'},{d:30,p:500,n:'30일 연속 학습'}];
var GIFTS=[
 {id:'baek_a', n:'빽다방 아메리카노', ic:'☕', p:700,  d:'따뜻한/아이스 택 1'},
 {id:'mega_a', n:'메가커피 아메리카노', ic:'🥤', p:700,  d:'따뜻한/아이스 택 1'},
 {id:'baek_s', n:'빽다방 음료 + 디저트', ic:'🍩', p:1200, d:'세트 교환권'},
 {id:'book',   n:'교재비 10,000원 할인', ic:'📘', p:1000, d:'교재 구매 시 사용'},
 {id:'tuit1',  n:'수강료 10,000원 할인', ic:'🎟️', p:2000, d:'다음 등록 시 사용'},
 {id:'tuit3',  n:'수강료 30,000원 할인', ic:'🏆', p:5000, d:'다음 등록 시 사용'}
];
function ptRule(k){for(var i=0;i<PTRULE.length;i++)if(PTRULE[i].k===k)return PTRULE[i];return null;}
/* 하루 한도 안에서만 적립 — 어뷰징 방지 */
function addPt(k,extra){var r=ptRule(k);if(!r&&!extra)return 0;
 var t=today();var got=0;
 DB.save(function(d){
  d.ptday=d.ptday||{};d.ptday[t]=d.ptday[t]||{};d.ptlog=d.ptlog||[];d.gifts=d.gifts||[];if(typeof d.pt!=='number')d.pt=0;
  if(r){var used=d.ptday[t][k]||0;if(used>=r.cap)return;
   d.ptday[t][k]=used+1;got=r.p;d.pt=(d.pt||0)+r.p;
   d.ptlog.unshift({t:t,n:r.n,p:r.p});}
  if(extra){got+=extra.p;d.pt=(d.pt||0)+extra.p;d.ptlog.unshift({t:t,n:extra.n,p:extra.p});}
  if(d.ptlog.length>200)d.ptlog.length=200;
 });
 if(got>0)setTimeout(function(){toast('+'+got+'P 적립!');},300);
 ptCheckBonus();
 return got;}
function ptCheckBonus(){var d=DB.init();var t=today();d.ptday=d.ptday||{};
 PTBONUS.forEach(function(b){
  if((d.streak||0)>=b.d && !(d.ptday['bonus'+b.d])){
   DB.save(function(x){x.ptday=x.ptday||{};x.ptlog=x.ptlog||[];x.ptday['bonus'+b.d]=t;x.pt=(x.pt||0)+b.p;x.ptlog.unshift({t:t,n:b.n+' 보너스',p:b.p});});
   setTimeout(function(){toast('🔥 '+b.n+' 보너스 +'+b.p+'P');},900);}
 });}

function vShop(d){
 var cards=GIFTS.map(function(g){var ok=(d.pt||0)>=g.p;
  return '<div class="gf'+(ok?' ok':'')+'"><div class="gi">'+g.ic+'</div>'+
   '<div class="gt"><b>'+g.n+'</b><span>'+g.d+'</span></div>'+
   '<button class="gb'+(ok?'':' off')+'" onclick="giftGo(\''+g.id+'\')">'+g.p.toLocaleString()+'P</button></div>';}).join('');
 var rules=PTRULE.map(function(r){return '<div class="pr"><span>'+r.n+'</span><b>+'+r.p+'P</b><em>하루 '+r.cap+'회</em></div>';}).join('')
  +PTBONUS.map(function(b){return '<div class="pr bo"><span>🔥 '+b.n+'</span><b>+'+b.p+'P</b><em>1회</em></div>';}).join('');
 var mine=(d.gifts||[]).slice(0,6).map(function(g){
   return '<div class="li"><div class="ic">'+g.ic+'</div><div class="tx"><b>'+g.n+'</b><span>'+g.t+' 신청 · '+(g.s||'데스크 수령 대기')+'</span></div></div>';}).join('');
 var log=(d.ptlog||[]).slice(0,12).map(function(l){
   return '<div class="pr"><span>'+l.n+'</span><b style="color:var(--green)">+'+l.p+'P</b><em>'+l.t.slice(5)+'</em></div>';}).join('')
   ||'<div class="pr"><span class="muted">아직 적립 내역이 없어요</span></div>';
 return '<div class="hero" style="background:linear-gradient(140deg,#0E8A5A,#14B06E)">'+
  '<div class="hi" style="color:#D6F5E7">산글 포인트</div>'+
  '<div class="nm"><b>'+(d.pt||0).toLocaleString()+'</b> P</div>'+
  '<div style="font-size:13px;color:#D6F5E7;margin-top:6px">공부한 만큼 쌓여요. 커피·교재·수강료로 바꿔 쓰세요.</div></div>'+
  '<div class="sec-t">바꿀 수 있는 것</div><div class="gwrap">'+cards+'</div>'+
  (mine?'<div class="sec-t">내 교환 신청</div><div class="card pad0">'+mine+'</div>':'')+
  '<div class="sec-t">이렇게 쌓여요</div><div class="card">'+rules+
  '<div class="muted" style="margin-top:10px">· 하루 한도가 있어서 몰아서 하는 것보다 <b>매일 조금씩</b>이 훨씬 많이 쌓여요.</div></div>'+
  '<div class="sec-t">적립 내역</div><div class="card">'+log+'</div>'+
  '<div class="card" style="background:var(--line2);box-shadow:none;font-size:12.5px;color:var(--ink2);line-height:1.7">'+
  '교환 신청 후 <b>학원 데스크에서 수령</b>하시거나 등록하신 번호로 기프티콘을 보내드립니다.<br>포인트는 현금으로 바꿀 수 없고, 유효기간은 마지막 적립일로부터 1년입니다.</div>';}

function giftGo(id){var d=DB.init();var g=null;GIFTS.forEach(function(x){if(x.id===id)g=x;});if(!g)return;
 if((d.pt||0)<g.p){toast('포인트가 '+(g.p-(d.pt||0)).toLocaleString()+'P 모자라요');return;}
 if(!confirm(g.ic+' '+g.n+'\n\n'+g.p.toLocaleString()+'P를 사용해 교환 신청할까요?\n남는 포인트 '+((d.pt||0)-g.p).toLocaleString()+'P'))return;
 DB.save(function(x){x.ptlog=x.ptlog||[];x.gifts=x.gifts||[];x.pt=(x.pt||0)-g.p;x.ptlog.unshift({t:today(),n:g.n+' 교환',p:-g.p});
  x.gifts.unshift({id:g.id,n:g.n,ic:g.ic,t:today(),s:'데스크 수령 대기'});});
 toast('교환 신청 완료! 데스크에서 받아가세요');render();}

function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on');},2200);}

/* ================= 콘텐츠 ================= */

/* ================= 음성 ================= */
function voices(){try{return speechSynthesis?speechSynthesis.getVoices():[];}catch(e){return[];}}
function pickVoice(code){var vs=voices();if(!vs.length)return null;var b=code.split('-')[0];
 var c=vs.filter(function(v){return v.lang&&v.lang.replace('_','-').toLowerCase().indexOf(b)===0;});if(!c.length)return null;
 var f=c.filter(function(v){return /female|woman|samantha|sarah|zira|kyoko|nanami|o-ren|ting|mei|xiao|yuna|joanna|ava/i.test(v.name);});
 return f[0]||c[0];}
function say(txt,code,cb){if(!window.speechSynthesis){if(cb)cb();return;}
 try{speechSynthesis.cancel();}catch(e){}
 var u=new SpeechSynthesisUtterance(txt);u.lang=code;var v=pickVoice(code);if(v)u.voice=v;u.rate=.9;u.pitch=1.05;
 u.onend=function(){if(cb)cb();};u.onerror=function(){if(cb)cb();};
 setTimeout(function(){try{speechSynthesis.speak(u);}catch(e){if(cb)cb();}},50);}
function SR(){return window.SpeechRecognition||window.webkitSpeechRecognition||null;}
function norm(s){return (s||'').toLowerCase().replace(/[^\w\s\u3040-\u30ff\u4e00-\u9fff]/g,'').replace(/\s+/g,' ').trim();}
function simil(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;
 var A=a.split(/\s+/),B=b.split(/\s+/);
 if(A.length<2&&B.length<2){var m=0,mx=Math.max(a.length,b.length);for(var i=0;i<Math.min(a.length,b.length);i++)if(a[i]===b[i])m++;return Math.round(m/mx*100);}
 var hit=0,used={};A.forEach(function(w){for(var j=0;j<B.length;j++){if(!used[j]&&B[j]===w){used[j]=1;hit++;return;}}});
 return Math.round(hit/Math.max(A.length,B.length)*100);}

function memoRec(step){var d=DB.init();var box=document.getElementById('mmR');if(!box)return;
 var R=SR();
 if(!R){memoType(step);return;}
 var rec=new R();rec.lang=LCODE[d.lang];rec.interimResults=true;rec.continuous=false;
 var fin='';
 box.innerHTML='🎙️ 듣고 있어요… 말씀하세요';
 rec.onresult=function(e){var it='';for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript+' ';else it+=e.results[i][0].transcript;}
  var b=document.getElementById('mmR');if(b)b.innerHTML='🎙️ '+esc2((fin+it).trim());};
 rec.onerror=function(ev){if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){memoType(step);}else{var b=document.getElementById('mmR');if(b)b.innerHTML='다시 한 번 눌러주세요.';}};
 rec.onend=function(){var t=fin.trim();if(!t){var b=document.getElementById('mmR');if(b)b.innerHTML='잘 안 들렸어요. 한 번 더 눌러주세요.';return;}memoScore(t,step);};
 try{rec.start();}catch(e){memoType(step);}
 setTimeout(function(){try{rec.stop();}catch(e){}},15000);}
function memoType(step){var box=document.getElementById('mmR');if(!box)return;

 var i=document.getElementById('mmIn');if(i){i.focus();i.onkeydown=function(e){if(e.key==='Enter')memoTyped(step);};}}
function memoTyped(step){var i=document.getElementById('mmIn');if(!i)return;var v=i.value.trim();if(!v)return;memoScore(v,step);}
function memoScore(said,step){var d=DB.init();var s=memoAll(d)[_mm.i];var box=document.getElementById('mmR');if(!box)return;
 var sc=simil(said,s[0]);
 var msg=sc>=80?'👏 아주 좋아요! ('+sc+'점)':sc>=55?'🙂 거의 다 왔어요 ('+sc+'점)':'🔁 한 번만 더 ('+sc+'점)';
 box.innerHTML=msg+'<div class="mm-said">들린 말: '+esc2(said)+'</div>';
 if(sc>=80&&step===3)setTimeout(memoDone,900);}
function memoDone(){var i=_mm.i;var t=today();
 DB.save(function(d){var m=memoState(d);m.done[i]=t;
  m.box[i]={n:0,next:addDays(t,MEMO_GAP[0])};m.last=t;
  d.days[t]=(d.days[t]||0)+2;});
 addPt('memo');closeSheet();toast('한 문장 완성! 🔥');render();}
function addDays(s,n){var p=s.split('-');var dt=new Date(+p[0],+p[1]-1,+p[2]);dt.setDate(dt.getDate()+n);
 return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}

 if(_sc.fb){scPaint('⌨️ '+_sc.lang+'로 답을 적어주세요','<div style="display:flex;gap:7px"><input id="scIn" class="fld" style="flex:1;border:1.5px solid var(--line);border-radius:11px;padding:12px" placeholder="입력…"><button class="btn g" style="width:auto;padding:0 18px" onclick="scTyped()">보내기</button></div>');
  var i=document.getElementById('scIn');if(i){i.focus();i.onkeydown=function(e){if(e.key==='Enter')scTyped();};}return;}
 var R=SR();var rec=new R();_sc.rec=rec;rec.lang=LCODE[_sc.lang];rec.interimResults=true;rec.continuous=false;
 var fin='';
 scPaint('🎙️ 듣고 있어요. 말씀하세요','<div class="heard" id="scLive"></div><button class="btn g" style="margin-top:10px" onclick="scStop()">답변 끝</button>');
 rec.onresult=function(e){var it='';for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript+' ';else it+=e.results[i][0].transcript;}
  var l=document.getElementById('scLive');if(l)l.textContent=(fin+it).trim();};
 rec.onerror=function(ev){if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){_sc.fb=true;scListen();}};

  '<div class="bar"><b><span>답변 수</span><span>'+_sc.log.filter(function(x){return x.me;}).length+'개</span></b><div class="t"><i style="width:'+Math.min(100,_sc.log.filter(function(x){return x.me;}).length*25)+'%"></i></div></div></div>'+

}

function crVisemes(txt){
 var out=[],s=(txt||'').toLowerCase();
 for(var i=0;i<s.length;i++){
   var c=s[i];
   if('aàá'.indexOf(c)>=0||'ぁあかさたなはまやらわがざだばぱャャアカサタナハマヤラワ'.indexOf(s[i])>=0)out.push('a');
   else if('eé'.indexOf(c)>=0||'えけせてねへめれエケセテネヘメレ'.indexOf(s[i])>=0)out.push('e');
   else if('iíy'.indexOf(c)>=0||'いきしちにひみりイキシチニヒミリ'.indexOf(s[i])>=0)out.push('i');
   else if('oó'.indexOf(c)>=0||'おこそとのほもよろオコソトノホモヨロ'.indexOf(s[i])>=0)out.push('o');
   else if('uú'.indexOf(c)>=0||'うくすつぬふむゆるウクスツヌフムユル'.indexOf(s[i])>=0)out.push('u');
   else if('bpm'.indexOf(c)>=0)out.push('m');
   else if(/[a-z぀-ヿ一-鿿]/.test(c))out.push(i%2?'e':'i');
 }
 if(!out.length)out=['a','e','i','o'];
 return out;
}

function crMarks(txt,lang){
 var t=' '+txt.toLowerCase()+' ',n=0,hit=[];
 function h(re,label){if(re.test(t)){n++;hit.push(label);}}
 if(lang==='영어'){
   h(/\b(was|were|did|went|had|saw|made|took|got|came|said|ate|bought)\b|\w+ed\b/,'과거시제');
   h(/\b(will|going to|gonna)\b/,'미래표현');
   h(/\b(can|could|should|would|might|have to|must)\b/,'조동사');
   h(/\b(because|but|although|so|if|when|while|however)\b/,'문장연결');
   h(/\b(who|which|that is|that are|where i)\b/,'관계사');
   h(/\b(have been|has been|have had|i've|i have)\b/,'현재완료');
 }else if(lang==='일본어'){
   h(/(ました|でした|だった|かった)/,'과거형');
   h(/(ています|ている|てる)/,'진행/상태');
   h(/(から|ので|けど|が、|でも|それで)/,'문장연결');
   h(/(と思います|と思う|でしょう|かもしれ)/,'의견표현');
   h(/(たら|れば|なら|とき)/,'조건/시간');
   h(/(られ|させ|ていただ|ございます)/,'수동·경어');
 }else{
   h(/(了|过)/,'완료·경험');
   h(/(因为|所以|但是|不过|虽然|而且)/,'문장연결');
   h(/(如果|要是|的话)/,'가정표현');
   h(/(觉得|认为|希望|想要)/,'의견표현');
   h(/(把|被)/,'把·被 구문');
   h(/(可以|应该|会|能|必须)/,'조동사');
 }
 return {n:n,hit:hit};
}


/* ---------- 크리스탈 · 앱 UI ---------- */
var _cr={lang:'영어',code:'en-US',log:[],rec:null,secs:30,left:30,timer:null,stop:false,
        heard:'',turns:0,pi:0,ui:0,fallback:false,t0:0};
var _crAnim=null,_crEnded=false;

function crStageCls(c){var s=document.getElementById('crStage');if(s)s.className='cr-stage'+(c?' '+c:'');}
function crMouthSet(k){var m=document.getElementById('crMouth');if(m)m.setAttribute('d',CR_MOUTH[k]||CR_MOUTH.rest);}
function crLipStart(txt){
 crLipStop();var vs=crVisemes(txt),k=0;crStageCls('talking');
 _crAnim=setInterval(function(){crMouthSet(vs[k%vs.length]);k++;if(k%7===0)crMouthSet('m');},95);
}
function crLipStop(){if(_crAnim){clearInterval(_crAnim);_crAnim=null;}crMouthSet('rest');crStageCls('');}
function crSay(text,code,cb){
 if(!window.speechSynthesis){crLipStart(text);setTimeout(function(){crLipStop();if(cb)cb();},Math.min(6000,text.length*70));return;}
 try{speechSynthesis.cancel();}catch(e){}
 var u=new SpeechSynthesisUtterance(text);u.lang=code;
 try{var v=pickVoice?pickVoice(code):null;if(v)u.voice=v;}catch(e){}
 u.rate=0.94;u.pitch=1.12;
 var done=false;function fin(){if(done)return;done=true;crLipStop();if(cb)cb();}
 u.onstart=function(){crLipStart(text);};
 u.onboundary=function(e){if(e&&typeof e.charIndex==='number'){crMouthSet(crVisemes(text.charAt(e.charIndex))[0]||'a');}};
 u.onend=fin;u.onerror=fin;crLipStart(text);
 setTimeout(function(){try{speechSynthesis.speak(u);}catch(e){fin();}},60);
 setTimeout(function(){if(!done&&!speechSynthesis.speaking)fin();},Math.max(3000,text.length*110));
}
function crBox(html){var s=document.getElementById('sheetIn');if(s)s.innerHTML=html;}
function openLevel(){openSheet('lvl');crPick();}
function crPick(){
 var d=DB.init();
 crBox('<div class="cr-wrap"><h3>AI 레벨테스트</h3><div class="sub">선생님을 고르면 30초 프리토킹이 시작됩니다</div>'+
  '<div class="cr-team">'+['영어','일본어','중국어'].map(function(l){var c=CRY[l];return '<button onclick="crIntro(\''+l+'\')"><div class="m">'+crAvatar(l)+'</div><b>'+c.me+'</b><span>'+l+'</span></button>';}).join('')+'</div>'+
  (d.lvl[d.lang]?'<div class="cr-sub">최근 '+d.lang+' 결과 · <b>'+d.lvl[d.lang]+'</b></div>':'')+
  '<div class="cr-sub">30초 대화로 BASIC · STEP 1~4 중<br>맞는 반과 교재를 찾아드립니다.</div>'+
  '<button class="btn o" style="margin-top:10px" onclick="closeSheet()">닫기</button></div>');
}
function crIntro(lang){
 _cr={lang:lang,code:CRY[lang].code,log:[],rec:null,secs:30,left:30,timer:null,stop:false,
      heard:'',turns:0,pi:0,ui:0,fallback:!SR(),t0:Date.now()};
 _crEnded=false;
 var c=CRY[lang];
 crBox('<div class="cr-wrap"><h3>'+lang+' AI 레벨테스트</h3>'+
  '<div class="cr-stage" id="crStage">'+crAvatar(_cr&&_cr.lang)+'</div>'+
  '<div class="cr-name">'+c.me+' · '+c.en+'</div><div class="cr-role">'+lang+' 레벨 담당</div>'+
  '<div class="cr-say">'+c.intro+'</div>'+
  (_cr.fallback?'<div class="cr-warn">이 브라우저는 음성 인식이 안 됩니다. 타이핑으로 진행됩니다.</div>':'')+
  '<div class="cr-sub">🎧 소리 켜기 · 🎙️ 마이크 허용</div>'+
  '<button class="btn g" style="margin-top:10px" onclick="crGo()">▶ 스타트 · 30초 대화 시작</button>'+
  '<button class="btn o" style="margin-top:8px" onclick="crRepeat()">🔊 다시 듣기</button>'+
  '<button class="btn o" style="margin-top:8px" onclick="crPick()">← 언어 다시 고르기</button></div>');
 setTimeout(function(){crSay(c.introSay,'ko-KR',null);},350);
}
function crRepeat(){crSay(CRY[_cr.lang].introSay,'ko-KR',null);}
function crRing(){
 var p=Math.max(0,_cr.left)/_cr.secs,off=214*(1-p);
 return '<div class="cr-ring"><svg width="78" height="78">'+
  '<circle cx="39" cy="39" r="34" stroke="#e7eaf2" stroke-width="7" fill="none"/>'+
  '<circle id="crArc" cx="39" cy="39" r="34" stroke="#0E8A5A" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="214" stroke-dashoffset="'+off+'"/>'+
  '</svg><i id="crNum">'+Math.max(0,_cr.left)+'</i></div>';
}
function crScreen(state,extra){
 crBox('<div class="cr-wrap"><h3>'+_cr.lang+' · 30초 프리토킹</h3>'+
  '<div class="cr-stage" id="crStage">'+crAvatar(_cr&&_cr.lang)+'</div>'+crRing()+
  '<div class="cr-say">'+state+'</div>'+(extra||'')+
  '<div class="chat" id="crLog">'+_cr.log.map(function(x){return '<div class="msg '+(x.me?'me':'')+'"><div class="bub">'+x.t+'</div></div>';}).join('')+'</div>'+
  '<button class="btn o" style="margin-top:8px" onclick="crQuit()">중단</button></div>');
 var l=document.getElementById('crLog');if(l)l.scrollTop=l.scrollHeight;
}
function crTick(){
 if(_cr.timer)clearInterval(_cr.timer);
 _cr.timer=setInterval(function(){
  _cr.left--;
  var n=document.getElementById('crNum');if(n)n.textContent=Math.max(0,_cr.left);
  var a=document.getElementById('crArc');if(a)a.setAttribute('stroke-dashoffset',214*(1-Math.max(0,_cr.left)/_cr.secs));
  if(_cr.left<=0){clearInterval(_cr.timer);_cr.timer=null;crEnd();}
 },1000);
}
function crGo(){
 var c=CRY[_cr.lang];_cr.left=_cr.secs;
 crScreen('🔊 크리스탈이 말하고 있어요…');
 crSay(c.open,_cr.code,function(){if(_cr.stop)return;_cr.log.push({me:false,t:c.open});crTick();crHear();});
}
function crQuit(){
 _cr.stop=true;if(_cr.timer){clearInterval(_cr.timer);_cr.timer=null;}
 try{speechSynthesis.cancel();}catch(e){}crLipStop();
 if(_cr.rec){try{_cr.rec.stop();}catch(e){}}crPick();
}
function crHear(){
 if(_cr.stop||_cr.left<=0)return;
 if(_cr.fallback){
  crScreen('⌨️ '+_cr.lang+'로 편하게 적어주세요.',
   '<div style="display:flex;gap:7px"><input id="crIn" style="flex:1;border:1.5px solid var(--line);border-radius:11px;padding:12px;min-width:0" placeholder="입력…"><button class="btn g" style="width:auto;padding:0 18px" onclick="crTyped()">보내기</button></div>');
  var i=document.getElementById('crIn');if(i){i.focus();i.onkeydown=function(e){if(e.key==='Enter')crTyped();};}
  return;
 }
 var R=SR(),rec;
 try{rec=new R();}catch(e){_cr.fallback=true;crHear();return;}
 _cr.rec=rec;rec.lang=_cr.code;rec.interimResults=true;rec.continuous=true;
 var fin='';crStageCls('hearing');
 crScreen('🎙️ 듣고 있어요. 지금 말씀하세요!','<div class="heard" id="crLive"></div>');
 rec.onresult=function(e){var it='';for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript+' ';else it+=e.results[i][0].transcript;}
  var l=document.getElementById('crLive');if(l)l.textContent=(fin+it).trim();};
 rec.onerror=function(ev){if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){_cr.fallback=true;crStageCls('');crHear();}};
 rec.onend=function(){crStageCls('');if(_cr.stop)return;var t=fin.trim();if(t)crGot(t);else if(_cr.left>0)crPushOn();};
 try{rec.start();}catch(e){_cr.fallback=true;crHear();return;}
 setTimeout(function(){if(_cr.rec===rec&&!_cr.stop){try{rec.stop();}catch(e){}}},9000);
}
function crTyped(){var i=document.getElementById('crIn');if(!i||!i.value.trim())return;crGot(i.value.trim());}
function crGot(t){
 _cr.heard+=' '+t;_cr.turns++;_cr.log.push({me:true,t:t});
 if(_cr.left<=2){crEnd();return;}
 var c=CRY[_cr.lang],q=c.probe[_cr.pi%c.probe.length];_cr.pi++;
 _cr.log.push({me:false,t:q});crScreen('🔊 크리스탈이 말하고 있어요…');
 crSay(q,_cr.code,function(){if(!_cr.stop&&_cr.left>0)crHear();});
}
function crPushOn(){
 if(_cr.stop||_cr.left<=2){if(_cr.left<=2)crEnd();return;}
 var c=CRY[_cr.lang],u=c.push[_cr.ui%c.push.length];_cr.ui++;
 _cr.log.push({me:false,t:u});crScreen('🔊 크리스탈이 말하고 있어요…');
 crSay(u,_cr.code,function(){if(!_cr.stop&&_cr.left>0)crHear();});
}
function crEnd(){
 if(_crEnded)return;_crEnded=true;_cr.stop=true;
 if(_cr.timer){clearInterval(_cr.timer);_cr.timer=null;}
 if(_cr.rec){try{_cr.rec.stop();}catch(e){}}
 crScreen('수고하셨어요! 결과를 계산하고 있어요…');
 crSay(CRY[_cr.lang].bye,_cr.code,function(){crResult();});
 setTimeout(function(){crResult();},6500);
}
function crResult(){
 if(document.getElementById('crBandBox'))return;
 var txt=_cr.heard.trim(),cjk=(_cr.code.indexOf('ja')===0||_cr.code.indexOf('zh')===0);
 var total=countW(txt,_cr.code);
 var toks=cjk?txt.replace(/\s/g,'').split(''):txt.toLowerCase().replace(/[^a-z\s']/g,' ').split(/\s+/);
 var set={},uniq=0;toks.filter(Boolean).forEach(function(w){if(!set[w]){set[w]=1;uniq++;}});
 var turns=_cr.turns,avg=turns?Math.round(total/turns):0,mk=crMarks(txt,_cr.lang);
 var sc=0;
 sc+= total>=60?4: total>=38?3: total>=22?2: total>=9?1:0;
 sc+= avg>=16?3: avg>=10?2: avg>=5?1:0;
 sc+= uniq>=45?3: uniq>=28?2: uniq>=14?1:0;
 sc+= mk.n>=5?3: mk.n>=3?2: mk.n>=1?1:0;
 var key= sc>=11?'STEP4': sc>=8?'STEP3': sc>=5?'STEP2': sc>=2?'STEP1':'BASIC';
 if(total<6)key='BASIC';
 if(key==='STEP4'&&mk.n<3)key='STEP3';
 if(key==='STEP3'&&mk.n<1&&total<45)key='STEP2';
 var B=CRBOOK[_cr.lang][key];
 var order=['BASIC','STEP1','STEP2','STEP3','STEP4'],idx=order.indexOf(key);
 var bars=order.map(function(k,i){return '<i class="'+(i<=idx?'on':'')+'"></i>';}).join('');
 try{addMin(Math.max(1,Math.round((Date.now()-_cr.t0)/60000)),'레벨테스트');}catch(e){}
 DB.save(function(d){d.lvl[_cr.lang]=B.n;});
 crBox('<div class="cr-wrap" id="crBandBox"><h3>'+_cr.lang+' 레벨 판정 결과</h3>'+
  '<div class="cr-stage" id="crStage">'+crAvatar(_cr&&_cr.lang)+'</div>'+
  '<div class="cr-band">'+B.n+'</div><span class="cr-cefr">'+B.cefr+'</span>'+
  '<div class="cr-steps">'+bars+'</div>'+
  '<div class="cr-book"><b>추천 교재 · 반</b><br>'+B.book+'<br><span style="color:#7a6f52">'+B.desc+'</span></div>'+
  '<div class="cr-mx"><div><b>'+total+'</b><span>발화량</span></div><div><b>'+uniq+'</b><span>어휘 수</span></div>'+
   '<div><b>'+avg+'</b><span>턴당 평균</span></div><div><b>'+mk.n+'</b><span>문법 요소</span></div></div>'+
  (mk.hit.length?'<div class="cr-sub">확인된 표현: <b>'+mk.hit.join(' · ')+'</b></div>':'')+
  '<div class="chat" style="max-height:150px">'+_cr.log.map(function(x){return '<div class="msg '+(x.me?'me':'')+'"><div class="bub">'+x.t+'</div></div>';}).join('')+'</div>'+
  '<p class="muted">※ 30초 대화를 자동 분석한 참고 결과입니다. 최종 반 배정은 강사가 직접 확인 후 결정합니다.</p>'+
  '<button class="btn g" style="margin-top:10px" onclick="closeSheet();go(\'learn\')">이 레벨로 학습 시작</button>'+
  '<button class="btn o" style="margin-top:8px" onclick="crIntro(\''+_cr.lang+'\')">다시 테스트하기</button>'+
  '<button class="btn o" style="margin-top:8px" onclick="location.href=\'index.html\'">학원 시간표 보기</button></div>');
 _crEnded=false;
}
