<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4622A">
<meta name="description" content="산본 로데오거리·중심상가 가게들의 오늘 이벤트를 한눈에. 사장님이 직접 올리는 산본 동네 할인 소식.">
<meta property="og:title" content="오늘산본 — 산본 가게들의 오늘 이벤트">
<meta property="og:description" content="오늘 뭐 먹지? 산본 가게 이벤트를 한눈에 보고 고르세요. 사장님 등록 무료.">
<title>오늘산본 — 산본 가게들의 오늘 이벤트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --ivory:#FBF6EE; --ink:#2A1F16; --ink2:#6E6152; --muted:#9A8E7E;
    --gold:#C9A15B; --red:#E2483D; --orange:#F4622A; --peach:#FFF1E6;
    --card:#FFFFFF; --line:#EADFCF; --red-soft:#FDECEA; --green:#2E8B4E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--ivory);color:var(--ink);
    font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:96px}

  header{padding:16px 18px 14px;background:linear-gradient(160deg,#FFF8F1 0%,#FFEFE1 100%);
    position:sticky;top:0;z-index:5;border-bottom:1px solid rgba(201,161,91,.25)}
  .brand{display:flex;align-items:center;gap:11px}
  .pin{flex:none;width:34px;height:46px}
  .brand h1{font-size:23px;font-weight:900;margin:0;letter-spacing:-.5px}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--ink2)}
  .today-badge{margin-left:auto;font-size:12.5px;font-weight:800;background:linear-gradient(130deg,var(--orange),var(--red));
    color:#fff;padding:7px 13px;border-radius:999px;white-space:nowrap}

  .ask{margin:14px 14px 0;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;gap:12px}
  .ask b{font-size:17px;font-weight:900;letter-spacing:-.3px}
  .ask span{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
  .ask .go{margin-left:auto;flex:none;font-size:13px;font-weight:800;color:var(--red);background:var(--red-soft);
    border:0;border-radius:999px;padding:9px 13px}

  .filters{padding:12px 14px 0}
  .frow{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .frow::-webkit-scrollbar{display:none}
  .chip{flex:none;font-size:13.5px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink2);white-space:nowrap}
  .chip.on{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}

  main{padding:2px 14px 10px}
  .count{font-size:12.5px;color:var(--ink2);padding:6px 2px 10px;display:flex;justify-content:space-between}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .top{display:flex;gap:12px}
  .ico{width:46px;height:46px;border-radius:13px;background:var(--peach);display:flex;align-items:center;justify-content:center;font-size:23px;flex:none}
  .info{flex:1;min-width:0}
  .row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:2px}
  .store{font-size:15.5px;font-weight:800;margin:0}
  .pill{font-size:11px;color:var(--ink2);background:var(--ivory);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
  .soon{font-size:11px;font-weight:800;color:#fff;background:var(--red);padding:2px 8px;border-radius:999px}
  .deal{font-size:19px;font-weight:900;color:var(--red);margin:5px 0 4px;line-height:1.3;letter-spacing:-.3px;word-break:keep-all}
  .meta{font-size:12px;color:var(--ink2);margin:0}
  .acts{display:flex;gap:8px;margin-top:13px}
  .btn{flex:1;text-align:center;font-size:13px;font-weight:600;padding:11px 0;border-radius:12px;border:1.5px solid var(--line);background:#fff}
  .btn.main{background:linear-gradient(130deg,var(--orange),var(--red));color:#fff;border-color:transparent;font-weight:800}
  .btn.heart{flex:none;width:46px}
  .btn.heart.on{background:var(--red-soft);color:var(--red);border-color:rgba(226,72,61,.3)}
  .empty{text-align:center;color:var(--ink2);font-size:14px;padding:36px 14px;line-height:1.75;background:#fff;border:1px dashed var(--line);border-radius:18px}
  .empty button{margin-top:12px;border:0;border-radius:12px;padding:12px 18px;font-weight:800;color:#fff;background:linear-gradient(130deg,var(--orange),var(--red))}
  .skel{height:132px;border-radius:18px;background:linear-gradient(90deg,#fff 0%,#F6EEE3 50%,#fff 100%);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px;border:1px solid var(--line)}
  @keyframes sh{to{background-position:-200% 0}}

  footer{padding:18px 18px 10px;font-size:11.5px;color:var(--muted);line-height:1.85;border-top:1px solid var(--line);margin-top:6px}

  .tabbar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:rgba(255,255,255,.96);
    border-top:1px solid var(--line);display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:6}
  .tab{flex:1;text-align:center;font-size:11.5px;color:var(--ink2);padding:5px 0;background:none;border:0}
  .tab .i{display:block;font-size:20px;margin-bottom:2px}
  .tab.on{color:var(--red);font-weight:800}

  .overlay{position:fixed;inset:0;background:rgba(80,50,30,.35);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  .sheet{width:100%;max-width:520px;background:var(--ivory);border-radius:22px 22px 0 0;max-height:90vh;overflow-y:auto;padding:0 18px 170px}
  .handle{width:38px;height:4px;background:var(--line);border-radius:9px;margin:14px auto 16px}
  .sheet h2{font-size:19px;font-weight:900;margin:0 0 4px}
  .hint{font-size:12.5px;color:var(--ink2);margin:4px 0 0;line-height:1.6}
  .field{margin:14px 0}
  .field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:6px;font-weight:700}
  .field input,.field textarea,.field select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;background:#fff;font-family:inherit;color:var(--ink)}
  .field textarea{resize:vertical;min-height:64px}
  .two{display:flex;gap:8px}
  .send{width:100%;padding:15px 0;border-radius:13px;border:0;background:linear-gradient(130deg,var(--orange),var(--red));color:#fff;font-size:16px;font-weight:900;margin-top:6px}
  .send:disabled{opacity:.6}
  .sub{width:100%;padding:12px 0;border-radius:13px;background:#fff;border:1.5px solid var(--line);font-size:14px;margin-top:8px}
  .msg{font-size:13.5px;border-radius:12px;padding:12px 14px;margin-top:12px;display:none;line-height:1.6}
  .msg.ok{display:block;background:#EAF6EE;color:var(--green)}
  .msg.err{display:block;background:var(--red-soft);color:var(--red)}
  .trap{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

  /* 직원에게 보여주기 — 밝은 화면에 큰 글씨 */
  .staff{position:fixed;inset:0;background:linear-gradient(170deg,#FFF6EC 0%,#FFE3CC 100%);display:none;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:30px 26px 120px;z-index:70}
  .staff.show{display:flex}
  .staff .who{font-size:18px;font-weight:800;color:var(--ink2)}
  .staff .big{font-size:34px;font-weight:900;line-height:1.3;color:var(--red);letter-spacing:-.6px;max-width:420px;margin-top:10px;word-break:keep-all}
  .staff .when{font-size:15px;color:var(--ink2);margin-top:16px;line-height:1.6}
  .staff .stamp{margin-top:22px;font-size:13px;font-weight:800;color:#fff;background:var(--orange);padding:8px 16px;border-radius:999px}

  .closebar{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));display:none;justify-content:center;z-index:80}
  .closebar.show{display:flex}
  .closebtn{width:56px;height:56px;border-radius:50%;background:#F4C94D;border:0;box-shadow:0 4px 16px rgba(120,80,0,.25);font-size:22px;font-weight:900;color:#5a4300}
  @media (prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="pin" viewBox="0 0 36 48" aria-hidden="true">
        <defs><linearGradient id="pg" x1="4" y1="1" x2="32" y2="46" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F4622A"/><stop offset="1" stop-color="#E2483D"/></linearGradient></defs>
        <path d="M18 1C10.3 1 4 7.3 4 15c0 10.5 14 32 14 32s14-21.5 14-32C32 7.3 25.7 1 18 1z" fill="url(#pg)"/>
        <circle cx="18" cy="15" r="6" fill="#fff"/><circle cx="18" cy="15" r="2.5" fill="#E2483D"/>
      </svg>
      <div><h1>오늘산본</h1><p>산본 가게들의 오늘 이벤트</p></div>
      <div class="today-badge" id="todayBadge">오늘</div>
    </div>
  </header>

  <div class="ask">
    <div><b>오늘 뭐 먹지?</b><span>산본 가게들이 올린 오늘의 할인만 모았어요</span></div>
    <button class="go" id="goReg" type="button">사장님 등록</button>
  </div>

  <div class="filters">
    <div class="frow" id="catRow" role="tablist" aria-label="업종"></div>
    <div class="frow" id="timeRow" role="tablist" aria-label="시간대"></div>
  </div>

  <main>
    <div class="count"><span id="countLine">불러오는 중…</span><span id="likeOnly"></span></div>
    <div id="feed"><div class="skel"></div><div class="skel"></div></div>
  </main>

  <footer>
    제작·운영 산본글로벌어학원 · 경기 군포시 산본로323번길 16-7 · 문의 031-466-6969 · sanbonglobal@naver.com<br>
    가게 이벤트는 사장님이 직접 등록하고, 확인 후 올라갑니다. 이벤트 내용·조건은 각 가게에 확인해 주세요.
  </footer>

  <nav class="tabbar">
    <button class="tab on" data-tab="feed" type="button"><span class="i">🗓️</span>오늘 이벤트</button>
    <button class="tab" data-tab="like" type="button"><span class="i">♥</span>찜한 곳</button>
    <button class="tab" data-tab="register" type="button"><span class="i">✍️</span>사장님 등록</button>
  </nav>
</div>

<div class="overlay" id="regOverlay" role="dialog" aria-modal="true" aria-labelledby="regTitle">
  <div class="sheet">
    <div class="handle"></div>
    <h2 id="regTitle">사장님 이벤트 등록 (무료)</h2>
    <p class="hint">적어서 「등록 신청」을 누르면 바로 접수돼요. 확인 후 오늘산본에 올라갑니다.</p>
    <div class="field"><label for="rStore">가게 이름</label><input id="rStore" maxlength="30" placeholder="예: 산본커피하우스" autocomplete="organization"></div>
    <div class="two">
      <div class="field" style="flex:1"><label for="rCat">업종</label>
        <select id="rCat"><option>음식점</option><option>카페</option><option>미용</option><option>운동</option><option>교육</option><option>기타</option></select></div>
      <div class="field" style="flex:1"><label for="rTime">주로 언제</label>
        <select id="rTime"><option>하루 종일</option><option>아침</option><option>점심</option><option>오후</option><option>저녁</option><option>밤</option></select></div>
    </div>
    <div class="field"><label for="rDeal">이벤트 내용 (한 줄)</label><textarea id="rDeal" maxlength="60" placeholder="예: 평일 2~5시 아메리카노 2,000원"></textarea></div>
    <div class="two">
      <div class="field" style="flex:1"><label for="rStart">시작일</label><input id="rStart" type="date"></div>
      <div class="field" style="flex:1"><label for="rEnd">종료일</label><input id="rEnd" type="date"></div>
    </div>
    <div class="field"><label for="rPhone">가게 전화 (손님에게 보여요)</label><input id="rPhone" inputmode="tel" maxlength="20" placeholder="031-000-0000"></div>
    <div class="field"><label for="rAddr">가게 위치 (지도 검색용)</label><input id="rAddr" maxlength="60" placeholder="예: 산본로데오거리 OO빌딩 1층"></div>
    <div class="field"><label for="rOwner">사장님 연락처 (확인 전화용, 비공개)</label><input id="rOwner" inputmode="tel" maxlength="20" placeholder="010-0000-0000"></div>
    <input class="trap" id="rTrap" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="send" id="rSend" type="button">등록 신청</button>
    <button class="sub" id="rCopy" type="button">카톡으로 보낼 문구 복사</button>
    <div class="msg" id="rMsg" role="status"></div>
  </div>
</div>

<div class="staff" id="staffView" role="dialog" aria-modal="true" aria-label="직원에게 보여주기">
  <div class="who" id="sWho"></div>
  <div class="big" id="sBig"></div>
  <div class="when" id="sWhen"></div>
  <div class="stamp">오늘산본 보고 왔어요</div>
</div>

<div class="closebar" id="closebar"><button class="closebtn" id="closeBtn" type="button" aria-label="닫기">✕</button></div>

<script>
(function(){
  "use strict";
  var API = 'https://script.google.com/macros/s/AKfycbz2kC-p3VD7xlgZcqbU22NvfsmmBxEBsPMPfvgNcEcHrVlHVi6OBJh9SJ5Y8d1bZd56/exec';
  var $ = function(id){ return document.getElementById(id); };
  var today = new Date(); today.setHours(0,0,0,0);
  var DAYS = ['일','월','화','수','목','금','토'];
  $('todayBadge').textContent = (today.getMonth()+1)+'월 '+today.getDate()+'일 '+DAYS[today.getDay()];

  var CATS = ['전체','음식점','카페','미용','운동','교육','기타'];
  var TIMES = ['전체','아침','점심','오후','저녁','밤'];
  var ICON = {'음식점':'🍽️','카페':'☕','미용':'💇','운동':'🏃','교육':'📚','기타':'🏪'};
  var state = { cat:'전체', time:'전체', likeOnly:false };
  var EVENTS = [], loaded = false, failed = false;

  /* 찜 — 이 폰에만 저장 */
  var LK = 'oneulsanbon_likes';
  function likes(){ try{ return JSON.parse(localStorage.getItem(LK) || '[]'); }catch(e){ return []; } }
  function setLikes(a){ try{ localStorage.setItem(LK, JSON.stringify(a)); }catch(e){} }
  function liked(id){ return likes().indexOf(id) > -1; }
  function toggle(id){ var l = likes(), i = l.indexOf(id); if(i > -1) l.splice(i,1); else l.push(id); setLikes(l); }

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function d(s){ var p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function md(s){ var x = d(s); return (x.getMonth()+1)+'.'+x.getDate(); }
  function daysLeft(s){ return Math.round((d(s) - today) / 864e5); }

  function chips(el, list, val, on){
    el.innerHTML = '';
    list.forEach(function(v){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip' + (v === val ? ' on' : ''); b.textContent = v;
      b.setAttribute('aria-pressed', v === val);
      b.onclick = function(){ on(v); };
      el.appendChild(b);
    });
  }

  function visible(){
    return EVENTS.filter(function(e){
      if (d(e.start) > today || d(e.end) < today) return false;
      if (state.cat !== '전체' && e.cat !== state.cat) return false;
      if (state.time !== '전체' && e.time !== state.time && e.time !== '하루 종일') return false;
      if (state.likeOnly && !liked(e.id)) return false;
      return true;
    }).sort(function(a,b){ return d(a.end) - d(b.end); });
  }

  function render(){
    chips($('catRow'), CATS, state.cat, function(v){ state.cat = v; render(); });
    chips($('timeRow'), TIMES, state.time, function(v){ state.time = v; render(); });
    var feed = $('feed');
    if (!loaded){ return; }
    var list = visible();
    $('countLine').textContent = (state.likeOnly ? '찜한 곳 ' : '오늘 진행 중인 이벤트 ') + list.length + '건';
    $('likeOnly').textContent = failed ? '연결이 불안정해요 — 잠시 후 새로고침' : '';
    if (!list.length){
      feed.innerHTML = state.likeOnly
        ? '<div class="empty">아직 찜한 곳이 없어요.<br>마음에 드는 이벤트에서 ♡를 눌러 두세요.</div>'
        : '<div class="empty">지금 조건에 맞는 이벤트가 없어요.<br>다른 업종·시간대를 눌러 보시거나,<br>사장님이시면 첫 이벤트를 올려 보세요.<br><button type="button" data-reg>무료로 이벤트 올리기</button></div>';
      var r = feed.querySelector('[data-reg]'); if (r) r.onclick = openReg;
      return;
    }
    feed.innerHTML = '';
    list.forEach(function(e){
      var left = daysLeft(e.end), on = liked(e.id);
      var card = document.createElement('article');
      card.className = 'card';
      card.innerHTML =
        '<div class="top"><div class="ico" aria-hidden="true">' + (ICON[e.cat] || '🏪') + '</div><div class="info">' +
          '<div class="row"><p class="store">' + esc(e.store) + '</p><span class="pill">' + esc(e.cat) + '</span>' +
          (left <= 1 ? '<span class="soon">' + (left <= 0 ? '오늘 마감' : '내일 마감') + '</span>' : '') + '</div>' +
          '<p class="deal">' + esc(e.deal) + '</p>' +
          '<p class="meta">' + md(e.start) + ' ~ ' + md(e.end) + ' · ' + esc(e.time) + '</p>' +
        '</div></div>' +
        '<div class="acts">' +
          '<a class="btn" target="_blank" rel="noopener" href="https://map.kakao.com/?q=' + encodeURIComponent(e.map || ('산본 ' + e.store)) + '">📍 위치</a>' +
          (e.phone ? '<a class="btn" href="tel:' + esc(String(e.phone).replace(/[^0-9]/g,'')) + '">📞 전화</a>' : '') +
          '<button class="btn main" type="button" data-s>직원에게</button>' +
          '<button class="btn heart' + (on ? ' on' : '') + '" type="button" aria-pressed="' + on + '" aria-label="찜" data-l>' + (on ? '♥' : '♡') + '</button>' +
        '</div>';
      card.querySelector('[data-s]').onclick = function(){ showStaff(e); };
      card.querySelector('[data-l]').onclick = function(){ toggle(e.id); render(); };
      feed.appendChild(card);
    });
  }

  function load(){
    fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ app:'today', action:'list' }) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        EVENTS = (j && j.ok && j.events) ? j.events : [];
        failed = !(j && j.ok);
        try{ localStorage.setItem('oneulsanbon_cache', JSON.stringify(EVENTS)); }catch(e){}
      })
      .catch(function(){
        failed = true;
        try{ EVENTS = JSON.parse(localStorage.getItem('oneulsanbon_cache') || '[]'); }catch(e){ EVENTS = []; }
      })
      .then(function(){ loaded = true; render(); });
  }

  /* 직원에게 보여주기 */
  var closer = null;
  function openLayer(id, fn){ $(id).classList.add('show'); $('closebar').classList.add('show'); closer = fn; }
  function closeAll(){
    ['regOverlay','staffView'].forEach(function(id){ $(id).classList.remove('show'); });
    $('closebar').classList.remove('show'); closer = null; setTab(state.likeOnly ? 'like' : 'feed');
  }
  function showStaff(e){
    $('sWho').textContent = e.store;
    $('sBig').textContent = e.deal;
    $('sWhen').textContent = md(e.start) + ' ~ ' + md(e.end) + ' · ' + e.time;
    openLayer('staffView', closeAll);
  }

  /* 사장님 등록 */
  function openReg(){
    $('rMsg').className = 'msg';
    if (!$('rStart').value){ var t = new Date(); $('rStart').value = t.toISOString().slice(0,10); }
    setTab('register'); openLayer('regOverlay', closeAll);
  }
  function form(){
    return { store:$('rStore').value.trim(), cat:$('rCat').value, time:$('rTime').value, deal:$('rDeal').value.trim(),
      start:$('rStart').value, end:$('rEnd').value, phone:$('rPhone').value.trim(), map:$('rAddr').value.trim(),
      owner:$('rOwner').value.trim(), trap:$('rTrap').value };
  }
  function check(f){
    if (!f.store) return '가게 이름을 적어 주세요.';
    if (!f.deal) return '이벤트 내용을 한 줄로 적어 주세요.';
    if (!f.start || !f.end) return '시작일과 종료일을 골라 주세요.';
    if (f.end < f.start) return '종료일이 시작일보다 빨라요.';
    if (!f.owner) return '확인 전화를 드릴 사장님 연락처를 적어 주세요.';
    return '';
  }
  function say(ok, t){ var m = $('rMsg'); m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = t; }
  $('rSend').onclick = function(){
    var f = form(), e = check(f); if (e){ say(false, e); return; }
    var b = this; b.disabled = true; b.textContent = '접수 중…';
    fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({ app:'today', action:'submit' }, f)) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (j && j.ok){ say(true, '접수됐어요. 확인 후 오늘산본에 올라갑니다. 궁금하시면 031-466-6969'); ['rStore','rDeal','rEnd','rPhone','rAddr','rOwner'].forEach(function(id){ $(id).value=''; }); }
        else say(false, (j && j.error) || '접수가 안 됐어요. 아래 「카톡으로 보낼 문구 복사」로 보내 주세요.');
      })
      .catch(function(){ say(false, '인터넷 연결이 불안정해요. 아래 「카톡으로 보낼 문구 복사」로 보내 주세요.'); })
      .then(function(){ b.disabled = false; b.textContent = '등록 신청'; });
  };
  $('rCopy').onclick = function(){
    var f = form(), e = check(f); if (e){ say(false, e); return; }
    var t = '[오늘산본 이벤트 등록]\n가게: ' + f.store + '\n업종: ' + f.cat + ' / ' + f.time + '\n내용: ' + f.deal +
      '\n기간: ' + f.start + ' ~ ' + f.end + '\n가게 전화: ' + (f.phone || '-') + '\n위치: ' + (f.map || '-') + '\n사장님 연락처: ' + f.owner;
    function fallback(){ var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(x){} document.body.removeChild(ta); }
    try{ (navigator.clipboard && navigator.clipboard.writeText) ? navigator.clipboard.writeText(t).catch(fallback) : fallback(); }catch(x){ fallback(); }
    say(true, '문구를 복사했어요. 산본글로벌어학원 카카오톡 채널에 붙여넣어 보내 주세요.');
  };
  $('goReg').onclick = openReg;

  /* 하단 탭 */
  function setTab(w){ document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on', t.getAttribute('data-tab') === w); }); }
  document.querySelectorAll('.tab').forEach(function(t){
    t.onclick = function(){
      var w = t.getAttribute('data-tab');
      if (w === 'register'){ openReg(); return; }
      state.likeOnly = (w === 'like'); setTab(w); render(); window.scrollTo(0,0);
    };
  });
  $('closeBtn').onclick = function(){ if (closer) closer(); };
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && closer) closer(); });

  render(); load();
})();
</script>
</body>
</html>
