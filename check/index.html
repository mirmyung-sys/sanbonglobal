<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>출결버스 · 산본글로벌어학원</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#03C75A">
<link rel="manifest" href="/check/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/check/icon-192.png">
<link rel="apple-touch-icon" href="/check/apple-icon-180.png">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#FBF7F1;color:#3A1F2A;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;text-align:center;padding:24px}
img{width:132px;height:132px}
h1{font-size:26px;font-weight:900}
p{font-size:16px;font-weight:700;color:#5B4650}
a{display:inline-block;margin-top:6px;background:#03C75A;color:#fff;font-size:18px;font-weight:800;padding:14px 28px;border-radius:99px;text-decoration:none}
a:focus-visible{outline:3px solid #E7A3B6;outline-offset:3px}
</style>
</head>
<body>
<img src="/check/icon-512.png" alt="산본글로벌어학원 SGA 로고">
<h1>출결버스</h1>
<p id="msg">아래 버튼을 누르면 출결 화면이 열려요</p>
<a id="go" href="https://script.google.com/macros/s/AKfycbwiqf3xPKPy-UpXIZ4LEpMnG4LHLHud_gYJNzm-l02RQH9JqFua9GBQMG-8PdypgiJu/exec">출결버스 열기</a>
<p id="tip" style="font-size:14px;color:#7A6570;margin-top:10px">바탕화면에 로고로 두려면: 크롬 ⋮ → 「홈 화면에 추가」</p>
<script>
var app=/[?&]app=1/.test(location.search)||matchMedia('(display-mode: standalone)').matches;
if(app){document.getElementById('msg').textContent='출결 화면을 여는 중이에요…';document.getElementById('tip').style.display='none';setTimeout(function(){location.replace(document.getElementById('go').href)},300);}
</script>
</body>
</html>
