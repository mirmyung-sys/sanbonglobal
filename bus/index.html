<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#03C75A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SGA 출결">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../img/sga_emblem.png">
<link rel="apple-touch-icon" href="../img/sga_emblem.png">
<title>SGA 출결버스</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --g:#03C75A; --g2:#02A94C; --g3:#E7F8EE; --g4:#C9EFD8;
  --o:#FF7A1A; --o2:#E8650A; --o3:#FFF1E6; --o4:#FFD9BC;
  --ink:#16251C; --ink2:#4B5E52; --ink3:#8A9A90;
  --bg:#F3F8F5; --card:#FFFFFF; --line:#DDE8E1; --red:#E5484D; --red3:#FDECEC;
  --gold:#B98A6A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  -webkit-user-select:none;user-select:none;overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--g);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;
  padding:max(20px,env(safe-area-inset-top)) 28px max(20px,env(safe-area-inset-bottom))}
.left,.right{display:flex;flex-direction:column;min-height:0}

/* 머리 */
.top{display:flex;align-items:center;gap:14px}
.logo{width:64px;height:64px;border-radius:50%;flex:none;filter:drop-shadow(0 2px 6px rgba(120,80,50,.25))}
.brand b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px}
.brand span{font-size:15px;color:var(--ink2);font-weight:600}
.clock{margin-left:auto;text-align:right}
.clock b{display:block;font-size:40px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.clock span{font-size:15px;color:var(--ink2);font-weight:600}

/* 등교·하원 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.mode{height:96px;border-radius:22px;background:var(--card);border:3px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:12px;font-size:34px;font-weight:800;color:var(--ink3);
  transition:transform .08s, background .15s, border-color .15s, color .15s}
.mode svg{width:34px;height:34px}
.mode:active{transform:scale(.97)}
.mode.in.on{background:var(--g);border-color:var(--g);color:#fff;box-shadow:0 8px 22px rgba(3,199,90,.35)}
.mode.out.on{background:var(--o);border-color:var(--o);color:#fff;box-shadow:0 8px 22px rgba(255,122,26,.35)}

/* 번호 칸 */
.entry{margin-top:20px;background:var(--card);border-radius:24px;padding:22px 22px 18px;border:2px solid var(--line);flex:1;
  display:flex;flex-direction:column;justify-content:center;min-height:0}
.ask{font-size:21px;font-weight:700;text-align:center;color:var(--ink2)}
.ask em{font-style:normal;color:var(--g2)}
body.m-out .ask em{color:var(--o2)}
.boxes{display:grid;grid-template-columns:repeat(4,1fr) 14px repeat(2,1fr);gap:10px;margin:18px auto 0;width:100%;max-width:520px}
.box{aspect-ratio:1/1.12;border-radius:16px;background:var(--bg);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:46px;font-weight:800;font-variant-numeric:tabular-nums}
.box.fill{background:#fff;border-color:var(--g)}
body.m-out .box.fill{border-color:var(--o)}
.box.next{border-color:var(--ink3);border-style:dashed}
.box.zz{color:var(--ink3);font-size:30px}
.gap{align-self:center;text-align:center;color:var(--ink3);font-size:26px;font-weight:800}
.tip{margin-top:14px;text-align:center;font-size:16px;color:var(--ink3);font-weight:600}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* 키패드 */
.pad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:14px;min-height:0}
.k{border-radius:22px;background:var(--card);border:2px solid var(--line);font-size:48px;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--line);transition:transform .06s}
.k:active,.k.hit{transform:translateY(3px);box-shadow:none;background:var(--g3)}
body.m-out .k:active,body.m-out .k.hit{background:var(--o3)}
.k.sub{font-size:22px;color:var(--ink2);background:#F7FAF8}
.k svg{width:40px;height:40px}

/* 결과 */
.veil{position:fixed;inset:0;background:rgba(22,37,28,.28);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
.veil.show{display:flex}
.card{width:min(620px,100%);background:#fff;border-radius:30px;padding:34px 34px 28px;text-align:center;box-shadow:0 30px 70px rgba(22,37,28,.28);
  border-top:14px solid var(--g);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.card.out{border-top-color:var(--o)} .card.warn{border-top-color:#F5B700} .card.err{border-top-color:var(--red)}
.tag{display:inline-block;padding:8px 20px;border-radius:99px;font-size:20px;font-weight:800;background:var(--g3);color:var(--g2)}
.card.out .tag{background:var(--o3);color:var(--o2)} .card.warn .tag{background:#FFF6D6;color:#9A7200} .card.err .tag{background:var(--red3);color:var(--red)}
.who{font-size:54px;font-weight:800;letter-spacing:-1.5px;margin-top:14px;line-height:1.15}
.cls{font-size:19px;color:var(--ink2);font-weight:600;margin-top:6px;min-height:1px}
.when{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin-top:10px;color:var(--g2)}
.card.out .when{color:var(--o2)}
.msg{font-size:21px;font-weight:600;color:var(--ink2);margin-top:8px;line-height:1.5;white-space:pre-line}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{padding:8px 14px;border-radius:12px;background:var(--bg);font-size:17px;font-weight:700;color:var(--ink2)}
.chip.ok{background:var(--g3);color:var(--g2)} .chip.no{background:var(--red3);color:var(--red)}
.acts{display:grid;gap:10px;margin-top:22px}
.acts.two{grid-template-columns:1fr 1fr}
.btn{height:68px;border-radius:18px;font-size:22px;font-weight:800;background:var(--bg);border:2px solid var(--line)}
.btn.g{background:var(--g);border-color:var(--g);color:#fff} .btn.o{background:var(--o);border-color:var(--o);color:#fff}
.btn.undo{color:var(--ink2)}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink3);width:100%;transform-origin:left}

/* 관리자 */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;padding:24px 28px}
.sheet.show{display:flex}
.sh-top{display:flex;align-items:center;gap:12px}
.sh-top h2{font-size:26px;font-weight:800;margin-right:auto}
.pill{height:52px;padding:0 22px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:18px;font-weight:700}
.pill.g{background:var(--g);border-color:var(--g);color:#fff}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.sum div{background:#fff;border-radius:18px;padding:16px 18px;border:2px solid var(--line)}
.sum b{display:block;font-size:38px;font-weight:800}
.sum span{font-size:16px;color:var(--ink2);font-weight:600}
.list{margin-top:16px;overflow:auto;flex:1;background:#fff;border-radius:18px;border:2px solid var(--line)}
.row{display:grid;grid-template-columns:1.2fr 1.6fr .8fr .8fr .8fr;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:18px;align-items:center}
.row.h{font-size:15px;color:var(--ink3);font-weight:700;position:sticky;top:0;background:#fff}
.row b{font-weight:800}
.abs{margin-top:12px;font-size:17px;color:var(--ink2);line-height:1.6}
.set{background:#fff;border-radius:18px;border:2px solid var(--line);padding:18px;margin-top:16px}
.set label{display:block;font-size:16px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.set input[type=text]{width:100%;height:52px;border-radius:12px;border:2px solid var(--line);padding:0 14px;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.set .line{display:flex;gap:10px;margin-top:10px;align-items:center;flex-wrap:wrap}
.pinpad{display:grid;grid-template-columns:repeat(3,96px);gap:12px;justify-content:center;margin-top:20px}
.pinpad .k{height:80px;font-size:34px}
.pinshow{font-size:44px;letter-spacing:16px;text-align:center;margin-top:28px;min-height:56px;font-weight:800}

.state{margin-top:12px;font-size:14px;font-weight:700;color:var(--ink3);display:flex;gap:6px;align-items:center}
.state i{width:9px;height:9px;border-radius:50%;background:var(--g)}
.state.off i{background:var(--red)} .state.demo i{background:#F5B700}

@media (orientation:portrait), (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:20px}
  .entry{flex:none;padding:22px 18px 18px}
  .state{position:static;transform:none;justify-content:center;margin-top:12px}
}
@media (max-width:600px), (max-height:640px){
  body{overflow:auto}
  .app{height:auto;min-height:100%;padding:16px;gap:14px;grid-template-rows:auto auto;align-content:start}
  .logo{width:48px;height:48px} .brand b{font-size:19px} .brand span{font-size:13px}
  .clock b{font-size:28px} .clock span{font-size:13px}
  .modes{margin-top:14px;gap:10px} .mode{height:74px;font-size:27px;border-radius:18px}
  .entry{margin-top:12px;padding:16px} .ask{font-size:16px}
  .boxes{gap:7px;margin-top:12px} .box{font-size:34px;border-radius:12px} .gap{font-size:20px}
  .tip{font-size:14px}
  .pad{gap:10px;grid-auto-rows:74px} .k{font-size:36px;border-radius:18px} .k.sub{font-size:18px}
  .who{font-size:40px} .when{font-size:48px} .card{padding:26px 22px 22px}
  .row{grid-template-columns:1fr 1.2fr .8fr .8fr;font-size:15px} .row .m{display:none}
  .sum b{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="m-in">
<div class="app">
  <section class="left">
    <div class="top">
      <img class="logo" id="logo" src="../img/sga_emblem.png" alt="산본글로벌어학원 SGA">
      <div class="brand"><b>산본글로벌어학원</b><span>출결버스</span></div>
      <div class="clock"><b id="clk">--:--</b><span id="day"></span></div>
    </div>

    <div class="modes" role="radiogroup" aria-label="등교 또는 하원">
      <button class="mode in on" id="mIn" role="radio" aria-checked="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>등교</button>
      <button class="mode out" id="mOut" role="radio" aria-checked="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>하원</button>
    </div>

    <div class="entry" id="entry">
      <p class="ask"><em id="askMode">등교</em> · 휴대폰 뒤 4자리 + 00</p>
      <div class="boxes" id="boxes" aria-live="polite"></div>
      <p class="tip">예) 010-1234-<b>5678</b> → 5 6 7 8 0 0</p>
    </div>
    <div class="state" id="state"><i></i><span id="stateTx">연결 확인 중</span></div>
  </section>

  <section class="right">
    <div class="pad" id="pad"></div>
  </section>
</div>

<div class="veil" id="veil"><div class="card" id="card" role="alertdialog" aria-live="assertive"></div></div>

<div class="sheet" id="pinSheet">
  <div class="sh-top"><h2>관리자 번호</h2><button class="pill" data-close>닫기</button></div>
  <div class="pinshow" id="pinShow"></div>
  <div class="pinpad" id="pinPad"></div>
</div>

<div class="sheet" id="admin">
  <div class="sh-top">
    <h2 id="adTitle">오늘 출결</h2>
    <button class="pill" id="adReload">새로고침</button>
    <button class="pill" id="adFull">전체화면</button>
    <button class="pill g" data-close>키패드로</button>
  </div>
  <div class="sum">
    <div><b id="sIn">0</b><span>오늘 온 학생</span></div>
    <div><b id="sNow">0</b><span>아직 수업 중</span></div>
    <div><b id="sAbs">0</b><span>안 온 학생 (전체 <em id="sAll" style="font-style:normal">0</em>명 중)</span></div>
  </div>
  <div class="list" id="adList"></div>
  <p class="abs" id="adAbs"></p>
  <div class="set">
    <label for="apiIn">구글 시트 연결 주소 (Apps Script 웹 앱 주소)</label>
    <input type="text" id="apiIn" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false">
    <div class="line">
      <button class="pill g" id="apiSave">저장하고 연결 확인</button>
      <label style="margin:0;display:flex;gap:8px;align-items:center;font-size:17px"><input type="checkbox" id="voiceOn"> 이름 읽어주기(음성)</label>
      <span id="apiMsg" style="font-size:16px;font-weight:700"></span>
    </div>
  </div>
</div>


<script>
/* ───────── 설정 ───────── */
const API_DEFAULT = 'https://script.google.com/macros/s/AKfycbz2kC-p3VD7xlgZcqbU22NvfsmmBxEBsPMPfvgNcEcHrVlHVi6OBJh9SJ5Y8d1bZd56/exec'; // 산본글로벌어학원_출결버스 시트 연결 (theju0911)
const DEMO = /[?&]demo=1/.test(location.search);
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('sgabus_'+k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('sgabus_'+k, JSON.stringify(v)); }catch(e){} }
};
let API = LS.get('api', API_DEFAULT) || API_DEFAULT;
let voice = LS.get('voice', true);

/* ───────── 화면 조립 ───────── */
const $ = id => document.getElementById(id);
let mode = 'in', code = '', busy = false, closeT = null, barT = null, pin = '', logoTaps = [];

function drawBoxes(){
  let h = '';
  for (let i=0;i<6;i++){
    if (i===4) h += '<div class="gap">+</div>';
    const ch = code[i] || '';
    const cls = ['box'];
    if (ch) cls.push('fill'); else if (i===code.length) cls.push('next');
    if (!ch && i>=4) cls.push('zz');
    h += '<div class="'+cls.join(' ')+'">'+(ch || (i>=4 ? '0' : ''))+'</div>';
  }
  $('boxes').innerHTML = h;
}
const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-7 7 7 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>';
function drawPad(el, onKey){
  const keys = ['1','2','3','4','5','6','7','8','9','clr','0','del'];
  el.innerHTML = keys.map(k => '<button class="k'+(k.length>1?' sub':'')+'" data-k="'+k+'" aria-label="'+(k==='clr'?'전체 지움':k==='del'?'한 칸 지움':k)+'">'+
    (k==='clr'?'전체 지움':k==='del'?ICON_BACK:k)+'</button>').join('');
  el.addEventListener('pointerdown', e => {
    const b = e.target.closest('.k'); if (!b) return;
    e.preventDefault(); b.classList.add('hit'); setTimeout(()=>b.classList.remove('hit'),110);
    onKey(b.dataset.k);
  });
}
drawPad($('pad'), key);
drawBoxes();

function setMode(m){
  mode = m;
  $('mIn').classList.toggle('on', m==='in');  $('mIn').setAttribute('aria-checked', m==='in');
  $('mOut').classList.toggle('on', m==='out'); $('mOut').setAttribute('aria-checked', m==='out');
  document.body.className = 'm-'+m;
  $('askMode').textContent = m==='in' ? '등교' : '하원';
  code = ''; drawBoxes();
}
$('mIn').addEventListener('click', ()=>{ setMode('in'); tick(660); });
$('mOut').addEventListener('click', ()=>{ setMode('out'); tick(520); });

window.addEventListener('keydown', e => {
  if ($('admin').classList.contains('show') || $('pinSheet').classList.contains('show')) return;
  if (/^[0-9]$/.test(e.key)) key(e.key);
  else if (e.key==='Backspace') key('del');
  else if (e.key==='Escape') { if ($('veil').classList.contains('show')) closeCard(); else key('clr'); }
  else if (e.key==='ArrowLeft') setMode('in');
  else if (e.key==='ArrowRight') setMode('out');
});

function key(k){
  if (busy) return;
  if ($('veil').classList.contains('show')) closeCard();
  if (k==='clr'){ code=''; }
  else if (k==='del'){ code = code.slice(0,-1); }
  else if (code.length < 6){ code += k; tick(880); }
  drawBoxes();
  if (code.length===6) setTimeout(()=>send({code, mode}), 160);
}

/* ───────── 소리 ───────── */
let actx = null;
function tick(f){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain();
  o.frequency.value=f; g.gain.setValueAtTime(.08,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.09);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.1);}catch(e){} }
function chime(ok){ [ok?784:330, ok?1047:262].forEach((f,i)=>setTimeout(()=>tick(f),i*130)); }
function say(t){ if(!voice||!window.speechSynthesis) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; u.rate=1.05; speechSynthesis.speak(u);}catch(e){} }

/* ───────── 서버 ───────── */
async function call(body){
  if (DEMO) return demoCall(body);
  if (!API) throw new Error('noapi');
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error('http '+r.status);
  return r.json();
}

/* 인터넷이 끊겨도 기록을 잃지 않게 — 기기에 모아 두었다가 연결되면 보낸다 */
let queue = LS.get('queue', []);
async function flush(){
  if (!queue.length || DEMO || !API) return;
  const rest = [];
  for (const q of queue){ try{ await call(q); }catch(e){ rest.push(q); } }
  queue = rest; LS.set('queue', queue); status();
}
setInterval(flush, 30000);

async function send(req){
  busy = true;
  const body = Object.assign({action:'check', ts: Date.now()}, req);
  let r;
  try { r = await call(body); }
  catch(e){
    busy = false; code = ''; drawBoxes();
    if (e.message==='noapi'){ show({kind:'err', tag:'연결 안 됨', who:'설정이 필요해요', msg:'로고를 다섯 번 눌러 관리자 화면에서\n구글 시트 연결 주소를 넣어 주세요.'}); return; }
    queue.push(body); LS.set('queue', queue); status();
    show({kind: req.mode==='out'?'out':'', tag: req.mode==='out'?'하원 접수':'등교 접수', who: fmtCode(req.code), when: hm(new Date()),
          msg:'인터넷이 잠시 끊겼어요.\n기록은 이 기기에 저장했다가 연결되면 시트로 보냅니다.'});
    chime(true); return;
  }
  busy = false; code = ''; drawBoxes(); online(true);
  render(r, req);
}

function render(r, req){
  if (!r.ok && r.status!=='bad'){ show({kind:'err', tag:'오류', who:'다시 눌러 주세요', msg: r.error || ''}); chime(false); return; }
  switch (r.status){
    case 'bad': shake(); return;
    case 'notfound':
      show({kind:'err', tag:'번호 없음', who: fmtCode(req.code), msg:'등록된 번호가 아니에요.\n번호를 다시 확인하거나 데스크에 말씀해 주세요.'});
      chime(false); say('등록되지 않은 번호입니다'); return;
    case 'multi':
      show({kind:'warn', tag:'이름을 골라 주세요', who:'같은 번호가 '+r.names.length+'명', msg:'',
        acts: r.names.map((n,i)=>({t:n, c:'g', f:()=>send(Object.assign({}, req, {pick:r.raw[i]}))})), cols:1});
      return;
    case 'in': {
      show({kind:'', tag:'등교 완료', who:r.name, cls:r.cls, when:r.time, chips:rateChips(r),
        acts:[{t:'잘못 눌렀어요 — 되돌리기', c:'undo', f:()=>undo(r.rid,'in',r.name)}], timer:10000});
      chime(true); say(r.name+' 등교'); return; }
    case 'out': {
      const m = r.minutes||0, dur = m>=60 ? Math.floor(m/60)+'시간 '+(m%60)+'분' : m+'분';
      show({kind:'out', tag:'하원 완료', who:r.name, cls:r.cls, when:r.time, msg:'등교 '+r.inTime+' · 머문 시간 '+dur, chips:rateChips(r),
        acts:[{t:'잘못 눌렀어요 — 되돌리기', c:'undo', f:()=>undo(r.rid,'out',r.name)}], timer:10000});
      chime(true); say(r.name+' 하원'); return; }
    case 'already_in':
      show({kind:'warn', tag:'이미 등교했어요', who:r.name, cls:r.cls, msg:'오늘 '+r.inTime+'에 등교 기록이 있어요.\n지금 집에 가는 거라면 하원으로 기록할게요.',
        acts:[{t:'하원으로 기록', c:'o', f:()=>{ setMode('out'); send(Object.assign({}, req, {mode:'out'})); }}, {t:'닫기', c:'', f:closeCard}], cols:2, timer:12000});
      chime(false); say('이미 등교했어요. 하원이면 하원 버튼을 누르세요'); return;
    case 'no_in':
      show({kind:'warn', tag:'등교 기록이 없어요', who:r.name, cls:r.cls, msg:'오늘 등교가 아직 안 찍혔어요.\n지금 들어오는 거라면 등교로 기록할게요.',
        acts:[{t:'등교로 기록', c:'g', f:()=>{ setMode('in'); send(Object.assign({}, req, {mode:'in'})); }}, {t:'닫기', c:'', f:closeCard}], cols:2, timer:12000});
      chime(false); say('등교 기록이 없어요'); return;
    case 'done':
      show({kind:'warn', tag:'오늘 출결 끝', who:r.name, cls:r.cls, msg:'등교 '+r.inTime+' · 하원 '+r.outTime+'\n오늘은 더 찍지 않아도 돼요.', timer:6000});
      chime(false); return;
  }
}
function rateChips(r){
  const c = [];
  if (r.days) c.push({t:'출석 '+r.days+(r.total?' / '+r.total:'')+'회'});
  if (r.total){ c.push({t:'출석률 '+r.rate+'%'}); c.push({t: r.refund ? '환급 기준 80% 충족' : '환급까지 '+Math.max(0, Math.ceil(r.total*0.8)-r.days)+'회 남음', k: r.refund?'ok':'no'}); }
  return c;
}
async function undo(rid, kind, name){
  busy = true;
  try { const r = await call({action:'undo', rid, kind}); busy=false;
    if (r.ok){ show({kind:'warn', tag:'되돌렸어요', who:name, msg:(kind==='in'?'등교':'하원')+' 기록을 지웠어요.\n위에서 등교·하원을 고르고 다시 눌러 주세요.', timer:5000}); say('되돌렸어요'); }
    else show({kind:'err', tag:'되돌리기 실패', who:name, msg:r.error||''});
  } catch(e){ busy=false; show({kind:'err', tag:'되돌리기 실패', who:name, msg:'인터넷 연결을 확인해 주세요.'}); }
}

/* ───────── 결과 카드 ───────── */
function show(o){
  clearTimeout(closeT); clearTimeout(barT);
  const c = $('card');
  c.className = 'card '+(o.kind||'');
  c.innerHTML =
    '<span class="tag">'+esc(o.tag)+'</span>'+
    '<div class="who">'+esc(o.who)+'</div>'+
    (o.cls?'<div class="cls">'+esc(o.cls)+'</div>':'')+
    (o.when?'<div class="when">'+esc(o.when)+'</div>':'')+
    (o.msg?'<div class="msg">'+esc(o.msg)+'</div>':'')+
    (o.chips&&o.chips.length?'<div class="chips">'+o.chips.map(x=>'<span class="chip '+(x.k||'')+'">'+esc(x.t)+'</span>').join('')+'</div>':'')+
    (o.acts?'<div class="acts '+(o.cols===2?'two':'')+'">'+o.acts.map((a,i)=>'<button class="btn '+a.c+'" data-a="'+i+'">'+esc(a.t)+'</button>').join('')+'</div>':
            '<div class="acts"><button class="btn" data-a="x">닫기</button></div>')+
    (o.timer?'<div class="bar"><i id="barI"></i></div>':'');
  c.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); const a = b.dataset.a;
    if (a==='x') return closeCard();
    closeCard(); o.acts[+a].f();
  }));
  $('veil').classList.add('show');
  if (o.timer){
    const bar = $('barI'); bar.style.transition='none'; bar.style.transform='scaleX(1)';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ bar.style.transition='transform '+o.timer+'ms linear'; bar.style.transform='scaleX(0)'; }));
    closeT = setTimeout(closeCard, o.timer);
  }
}
function closeCard(){ clearTimeout(closeT); $('veil').classList.remove('show'); }
$('veil').addEventListener('click', e => { if (e.target.id==='veil') closeCard(); });
function shake(){ const e=$('entry'); e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtCode(c){ return c.slice(0,4)+' '+c.slice(4); }
function hm(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

/* ───────── 시계 · 연결 상태 ───────── */
const DAYS = ['일','월','화','수','목','금','토'];
function clock(){ const d=new Date(); $('clk').textContent=hm(d); $('day').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+DAYS[d.getDay()]+'요일'; }
clock(); setInterval(clock, 5000);
let isOnline = null;
function online(v){ isOnline = v; status(); }
function status(){
  const s = $('state'), t = $('stateTx');
  if (DEMO){ s.className='state demo'; t.textContent='체험 모드 — 기록이 시트로 가지 않습니다 (번호 123400)'; return; }
  if (!API){ s.className='state off'; t.textContent='구글 시트 연결 전'; return; }
  s.className = 'state'+(isOnline===false?' off':'');
  t.textContent = (isOnline===false?'인터넷 끊김':'구글 시트 연결됨') + (queue.length?' · 보낼 기록 '+queue.length+'건':'');
}
async function ping(){ if (DEMO||!API) return status(); try{ const r=await call({action:'ping'}); online(!!r.ok); flush(); }catch(e){ online(false); } }
ping(); setInterval(ping, 120000);

/* ───────── 관리자 (로고 5번) ───────── */
$('logo').addEventListener('click', ()=>{
  const n = Date.now(); logoTaps = logoTaps.filter(t=>n-t<3000); logoTaps.push(n);
  if (logoTaps.length>=5){ logoTaps=[]; openPin(); }
});
function openPin(){
  pin=''; $('pinShow').textContent=''; $('pinSheet').classList.add('show');
}
drawPad($('pinPad'), k => {
  if (k==='clr') pin=''; else if (k==='del') pin=pin.slice(0,-1); else if (pin.length<8) pin+=k;
  $('pinShow').textContent = '•'.repeat(pin.length);
  if (pin.length>=4 && (DEMO || !API)) { if (!API || pin==='6969'){ $('pinSheet').classList.remove('show'); openAdmin(); } }
  else if (pin.length>=4) tryPin();
});
let pinT=null;
function tryPin(){ clearTimeout(pinT); pinT=setTimeout(async()=>{
  try{ const r = await call({action:'today', pin}); if (r.ok){ $('pinSheet').classList.remove('show'); openAdmin(r); } else if (pin.length>=6){ $('pinShow').textContent='번호가 달라요'; pin=''; } }catch(e){}
}, 350); }
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('.sheet').classList.remove('show')));

function openAdmin(data){
  $('apiIn').value = API; $('voiceOn').checked = voice; $('apiMsg').textContent='';
  $('admin').classList.add('show');
  if (data) drawAdmin(data); else if (DEMO) drawAdmin(demoToday()); else $('adList').innerHTML='<div class="row">연결 주소를 넣으면 오늘 출결이 보입니다.</div>';
}
function drawAdmin(d){
  $('adTitle').textContent = '오늘 출결 · '+d.date;
  const now = d.rows.filter(r=>!r.out).length;
  $('sIn').textContent = d.rows.length; $('sNow').textContent = now; $('sAbs').textContent = d.absent.length; $('sAll').textContent = d.total;
  $('adList').innerHTML = '<div class="row h"><span>이름</span><span>반</span><span>등교</span><span>하원</span><span class="m">머문 시간</span></div>' +
    (d.rows.length ? d.rows.map(r=>'<div class="row"><b>'+esc(r.name)+'</b><span>'+esc(r.cls)+'</span><span>'+esc(r.in)+'</span><span>'+esc(r.out||'수업 중')+'</span><span class="m">'+esc(r.mins? r.mins+'분':'-')+'</span></div>').join('')
      : '<div class="row">오늘 기록이 아직 없어요.</div>');
  $('adAbs').textContent = d.absent.length ? '안 온 학생: '+d.absent.join(', ') : '';
}
$('adReload').addEventListener('click', async()=>{ try{ const r=await call({action:'today', pin: DEMO?'6969':pin}); if(r.ok) drawAdmin(r);}catch(e){} });
$('adFull').addEventListener('click', ()=>{ const d=document.documentElement; (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d); });
$('voiceOn').addEventListener('change', e=>{ voice = e.target.checked; LS.set('voice', voice); });
$('apiSave').addEventListener('click', async()=>{
  const v = $('apiIn').value.trim();
  if (v && !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(v)){ $('apiMsg').textContent='주소 모양이 달라요 (…/exec 로 끝나야 해요)'; return; }
  API = v; LS.set('api', v); $('apiMsg').textContent='확인 중…';
  try{ const r = await call({action:'ping'}); $('apiMsg').textContent = r.ok ? '연결됐어요' : '연결 실패'; online(!!r.ok); }
  catch(e){ $('apiMsg').textContent='연결 실패 — 배포 액세스가 「모든 사용자」인지 확인'; online(false); }
});

/* 화면 꺼짐 방지 (태블릿 상시 켜두기) */
async function wake(){ try{ if (navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){} }
wake(); document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') wake(); });

/* ───────── 체험 모드 (?demo=1) ───────── */
const demo = { st:[{name:'김하늘',cls:'영어회화 월수 19:00',code:'123400',total:16},{name:'이서준',cls:'토익 스파르타 중급',code:'567800',total:18},
  {name:'박지민',cls:'일본어 JLPT N3',code:'567800',total:16}], log:[] };
function demoCall(b){
  return new Promise(res=>setTimeout(()=>res(demoRun(b)), 250));
}
function demoRun(b){
  const t = hm(new Date());
  if (b.action==='ping') return {ok:true};
  if (b.action==='today') return demoToday();
  if (b.action==='undo'){ const r=demo.log.find(x=>x.rid===b.rid); if(!r) return {ok:false}; if(b.kind==='out'){r.out='';r.mins='';} else r.cancel=true; return {ok:true}; }
  let list = demo.st.filter(s=>s.code===b.code); if (b.pick) list=list.filter(s=>s.name===b.pick);
  if (!list.length) return {ok:true,status:'notfound'};
  if (list.length>1) return {ok:true,status:'multi',names:list.map(s=>s.name+' · '+s.cls),raw:list.map(s=>s.name)};
  const s=list[0], row=demo.log.find(x=>x.name===s.name&&!x.cancel), days=()=>demo.log.filter(x=>x.name===s.name&&!x.cancel).length;
  const base={ok:true,name:s.name,cls:s.cls};
  const rate=()=>({days:days(),total:s.total,rate:Math.round(days()/s.total*100),refund:days()/s.total>=.8});
  if (b.mode==='in'){ if(row&&row.out) return Object.assign(base,{status:'done',inTime:row.in,outTime:row.out}); if(row) return Object.assign(base,{status:'already_in',inTime:row.in});
    const rid='D'+Date.now(); demo.log.push({rid,name:s.name,cls:s.cls,in:t,out:''}); return Object.assign(base,{status:'in',time:t,rid},rate()); }
  if (!row) return Object.assign(base,{status:'no_in'}); if (row.out) return Object.assign(base,{status:'done',inTime:row.in,outTime:row.out});
  row.out=t; row.mins=0; return Object.assign(base,{status:'out',time:t,inTime:row.in,minutes:0,rid:row.rid},rate());
}
function demoToday(){ const rows=demo.log.filter(x=>!x.cancel).map(x=>({name:x.name,cls:x.cls,in:x.in,out:x.out,mins:x.mins}));
  const came=new Set(rows.map(r=>r.name)); const d=new Date();
  return {ok:true,date:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),rows,total:demo.st.length,absent:demo.st.filter(s=>!came.has(s.name)).map(s=>s.name)}; }
status();
</script>
